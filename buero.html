<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Büro</title>
<!-- Home Office · Büro: 3D-Großraumbüro mit 8 Mitarbeitern.
     Figuren nach Swipii Worker3D (Heike-Kühn-Design-System) und dem HM-Team-Büro, Farben Leon Brand Kit v1,
     Raumaufteilung nach Leons Referenzbild (Besprechung hinten links, Lounge Mitte, Arbeitsplätze hinten rechts,
     Küche vorne links, Empfang + Glasbüro der Leitung vorne rechts).
     Läuft eigenständig (Demo) oder in Home Office (iframe, Daten per postMessage). -->
<style>
  @font-face { font-family:"Manrope"; src:url("fonts/manrope-latin-400-normal.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Manrope"; src:url("fonts/manrope-latin-600-normal.woff2") format("woff2"); font-weight:600; }
  @font-face { font-family:"Manrope"; src:url("fonts/manrope-latin-700-normal.woff2") format("woff2"); font-weight:700; }
  @font-face { font-family:"Kalam"; src:url("fonts/kalam-latin-400-normal.woff2") format("woff2"); font-weight:400; }
  :root { --mitternacht:#1B2A44; --stahl:#4F6785; --nebel:#A9B8CA; --papier:#F4F0E8; --linie:#E2DCD0;
          --bg:#F4F0E8; --ink:#1B2A44; --muted:#4F6785; --glas:rgba(255,255,255,.82); --glasrand:rgba(255,255,255,.95); }
  :root[data-theme=dunkel] { --bg:#0F1726; --ink:#F4F0E8; --muted:#A9B8CA; --linie:rgba(169,184,202,.2); --glas:rgba(27,42,68,.78); --glasrand:rgba(169,184,202,.25); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:400 14px/1.5 "Manrope", "Segoe UI", system-ui, sans-serif; }
  #szene { position:absolute; inset:0; } #szene canvas { display:block; outline:none; }
  .glas { background:var(--glas); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--glasrand); box-shadow:0 6px 18px rgba(11,18,32,.14); }
  header { position:absolute; top:14px; left:14px; right:14px; display:flex; gap:10px; align-items:center; pointer-events:none; z-index:6; }
  .marke { display:flex; align-items:center; gap:10px; padding:7px 16px 7px 8px; border-radius:18px; pointer-events:auto; }
  .marke svg { width:34px; height:34px; } h1 { margin:0; font:400 26px/1 "Kalam", cursive; }
  .chip { padding:6px 12px; border-radius:999px; font-size:12px; color:var(--muted); pointer-events:auto; display:flex; gap:6px; align-items:center; }
  .chip i { width:7px; height:7px; border-radius:50%; background:#4F6785; display:inline-block; }
  .sp { flex:1; }
  .btn { pointer-events:auto; border:1px solid var(--glasrand); background:var(--glas); color:var(--ink); border-radius:999px; padding:7px 13px; font:600 12.5px "Manrope", sans-serif; cursor:pointer; display:inline-flex; gap:6px; align-items:center; backdrop-filter:blur(14px); }
  .btn svg { width:16px; height:16px; }
  #log { position:absolute; top:70px; right:14px; width:300px; max-height:calc(100% - 160px); overflow:hidden; border-radius:18px; padding:12px 14px; z-index:5; }
  #log h2, .panel h2 { margin:0 0 8px; font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  #log ul { list-style:none; margin:0; padding:0; } #log li { display:grid; grid-template-columns:8px 1fr; gap:8px; padding:6px 0; border-top:1px solid var(--linie); font-size:12.5px; }
  #log li:first-child { border-top:0; } #log li i { width:8px; height:8px; border-radius:50%; margin-top:6px; } #log li small { display:block; color:var(--muted); font-size:11px; }
  #fragen { position:absolute; top:70px; left:14px; width:320px; border-radius:18px; padding:12px 14px; z-index:5; display:none; }
  #fragen.an { display:block; } .frage { padding:8px 0; border-top:1px solid var(--linie); font-size:13px; } .frage:first-of-type { border-top:0; }
  .frage .opts { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .schild { position:absolute; left:0; top:0; pointer-events:none; text-align:center; z-index:3; }
  .schild .k { display:inline-flex; flex-direction:column; align-items:center; padding:4px 10px; border-radius:12px; white-space:nowrap; }
  .schild .n { font-weight:700; font-size:12.5px; line-height:1.25; } .schild .r { font-size:10.5px; color:var(--muted); }
  .schild .s { font-size:11px; display:flex; gap:5px; align-items:center; color:var(--muted); max-width:230px; overflow:hidden; text-overflow:ellipsis; }
  .schild .s b { width:7px; height:7px; border-radius:50%; flex:none; }
  .schild.fern .r, .schild.fern .s { display:none; }
  .blase { position:absolute; left:0; top:0; z-index:4; pointer-events:none; padding:6px 11px; border-radius:14px 14px 14px 4px; font-size:12.5px; max-width:240px; transition:opacity .3s; background:var(--papier); color:#1B2A44; box-shadow:0 6px 16px rgba(11,18,32,.18); }
  .blase.lang { max-width:340px; }
  .panel { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); width:min(460px, calc(100% - 28px)); border-radius:20px; padding:14px 18px; z-index:7; display:none; }
  .panel.an { display:block; } .panel .kopf { display:flex; gap:12px; align-items:center; }
  .panel .av { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#F4F0E8; } .panel .av svg { width:22px; height:22px; --icon-dot:#A9B8CA; }
  .panel h3 { margin:0; font-size:16px; } .panel .sub { color:var(--muted); font-size:12.5px; }
  .panel ul { margin:10px 0; padding-left:18px; font-size:12.5px; } .panel .acts { display:flex; gap:8px; }
  .menu { position:absolute; top:62px; right:14px; width:280px; border-radius:18px; padding:14px; z-index:8; display:none; font-size:13px; }
  .menu.an { display:block; } .menu label { display:flex; gap:8px; align-items:center; padding:5px 0; } .menu select { font:inherit; padding:4px 8px; border-radius:8px; }
  .drop { position:absolute; inset:0; z-index:9; display:none; align-items:center; justify-content:center; background:rgba(27,42,68,.25); font:400 28px "Kalam", cursive; color:#F4F0E8; }
  .drop.an { display:flex; }
  .tipp { position:absolute; bottom:14px; left:14px; font-size:11.5px; color:var(--muted); padding:4px 10px; border-radius:10px; z-index:4; }
  svg.i { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; --icon-dot:#4F6785; }
</style>
</head>
<body>
<script src="i18n.js"></script>
<div id="szene"></div>
<header>
  <div class="marke glas"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#1B2A44"/><path d="M24 17v28h18" fill="none" stroke="#F4F0E8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 38.5v-7l5.5-4.6 5.5 4.6v7Z" fill="none" stroke="#A9B8CA" stroke-width="3.2" stroke-linejoin="round"/><circle cx="31.5" cy="17" r="3.2" fill="#A9B8CA"/></svg><h1>Büro</h1></div>
  <span class="chip glas" id="stand"><i></i>Live · alle 5 Sekunden</span>
  <span class="sp"></span>
  <button class="btn" id="fensterBtn" style="display:none" title="Büro in einem eigenen Fenster öffnen, z. B. für den zweiten Bildschirm"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="10" rx="2.5"/><path d="M8 19h11a2 2 0 0 0 2-2V9"/></svg><span id="fensterTxt">In eigenem Fenster</span></button>
  <button class="btn" id="tonBtn" title="Büro-Geräusche"></button>

</header>
<div id="fragen" class="glas"></div>
<div id="log" class="glas"><h2>Letzte Ereignisse</h2><ul id="logListe"></ul></div>
<div id="schilder"></div>
<div class="panel glas" id="panel"></div>
<div class="menu glas" id="menu">
  <h2 style="margin:0 0 8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)">Büro-Einstellungen</h2>
  <label>Wenn das Büro nicht sichtbar ist<select id="optHinter"><option value="pause">3D anhalten, Mitarbeiter arbeiten weiter</option><option value="weiter">alles weiterlaufen lassen</option></select></label>
  <label><input type="checkbox" id="optTon">Leise Büro-Geräusche</label>
  <label>Grafik<select id="optQual"><option value="hoch">höchste Qualität</option><option value="mittel">ausgewogen</option><option value="leicht">leicht</option></select></label>
  <label><input type="checkbox" id="optDreh" checked>Kamera dreht sich langsam</label>
  <label>Über den Köpfen<select id="optSchild"><option value="name">Name</option><option value="rolle">Aufgabenbereich</option><option value="beides">Name und Aufgabenbereich</option></select></label>
</div>
<div class="drop" id="drop">Brief hier fallen lassen – er kommt in den Briefkasten</div>
<div class="tipp glas">Ziehen = drehen · Mausrad = zoomen · Klick auf eine Person = Details · Dateien auf das Büro ziehen = Briefkasten</div>

<script src="lib/three.min.js"></script>
<script>
(function () {
"use strict";
const V3 = THREE.Vector3, PI = Math.PI;
const Q = new URLSearchParams(location.search);
const BRUECKE = window.bueroBridge || null;                       // eigenes Fenster (Home Office Desktop)
const FENSTER = !!BRUECKE;
const IM_PROGRAMM = window.parent !== window || FENSTER;
const anProgramm = m => { if (BRUECKE) BRUECKE.send(m); else if (window.parent !== window) parent.postMessage(m, "*"); };
let THEMA = Q.get("theme") || "system";
if (THEMA === "system") THEMA = matchMedia("(prefers-color-scheme: dark)").matches ? "dunkel" : "hell";
document.documentElement.dataset.theme = THEMA;
const DUNKEL = THEMA === "dunkel";

/* ---------- Einstellungen (nur für diesen Rechner) ---------- */
const EINST = Object.assign({ hinter: "pause", ton: true, qual: "hoch", dreh: true, schild: "beides" }, (() => { try { return JSON.parse(localStorage.getItem("oh-buero") || "{}"); } catch (e) { return {}; } })());
const speichereEinst = () => { try { localStorage.setItem("oh-buero", JSON.stringify(EINST)); } catch (e) {} };

/* ---------- Farben: Leon Brand Kit v1 ---------- */
const F = DUNKEL ? {
  klar: "#0F1726", boden: "#2A3344", holz: "#3A4150", wand: "#1E2A40", weiss: "#2E3B55", tisch: "#D8DEE6", teppich: "#2A3650", lounge: "#22324F", kueche: "#2B3242",
  chef: "#26344F", glas: "#7D90A8", rahmen: "#0B1220", mitternacht: "#C9D3DE", sofa: "#3B5272", stahl: "#4F6785", nebel: "#A9B8CA", papier: "#F4F0E8",
  pflanze: "#4E6B59", pflanze2: "#62806B", hose: "#16223A", licht: .78, sonne: .55, himmel: "#DCE4EE", erde: "#1B2A44"
} : {
  klar: "#F4F0E8", boden: "#CBC6BE", holz: "#E4DCCD", wand: "#F1EEE8", weiss: "#FBFAF7", tisch: "#FBFAF7", teppich: "#DAD7D1", lounge: "#D6DEE6", kueche: "#D3D0CA",
  chef: "#A9B8CA", glas: "#CFDAE6", rahmen: "#2B3446", mitternacht: "#1B2A44", sofa: "#1B2A44", stahl: "#4F6785", nebel: "#A9B8CA", papier: "#F4F0E8",
  pflanze: "#5F7F6A", pflanze2: "#7A9A80", hose: "#2A3A55", licht: .75, sonne: .62, himmel: "#FFFFFF", erde: "#B9B2A6"
};
const HAUT = ["#D9B396", "#C99A78", "#E3C1A6", "#B8876A", "#A87656"], HAAR = ["#3B302B", "#1F1B18", "#6B5444", "#2E2A2A", "#8A7462"];
const STATUS = {
  arbeitet: { farbe: "#4F6785", text: "arbeitet" }, rennt: { farbe: "#4F6785", text: "eilt zum Platz" },
  wartet: { farbe: "#7A5C1E", text: "hat eine Frage" }, bereit: { farbe: "#A9B8CA", text: "bereit" }, frei: { farbe: "#C5CCD6", text: "Pause" }
};

/* Leuchtende Zustände (Farben wie im Swipii-Büro von Heike Kühn): grün = arbeitet, orange = Pause, rot = außer Dienst (keine Aufgaben) */
const LAMPE = { arbeit: "#3DDC97", pause: "#F2B544", aus: "#FF5D5D" };
const AUS_NACH = 90; // Sekunden ohne Aufgabe → außer Dienst
function statusLampe(m, sek) {
  if (m.status === "arbeitet" || m.auftrag) return "arbeit";
  if (m.status === "wartet") return "pause";
  return sek - (m.letzteArbeit == null ? -1e9 : m.letzteArbeit) > AUS_NACH ? "aus" : "pause";
}
const LAMPE_TEXT = { arbeit: "arbeitet", pause: "Pause", aus: "außer Dienst – keine Aufgaben" };

/* ---------- Die 8 Mitarbeiter ---------- */
const ICON = {
  sekretariat: '<path d="M14 3.5H7.5A2.5 2.5 0 0 0 5 6v12a2.5 2.5 0 0 0 2.5 2.5h9A2.5 2.5 0 0 0 19 18V8.5Z"/><path d="M14 3.5V7a1.5 1.5 0 0 0 1.5 1.5H19"/><path d="M8.6 13h6.8"/><path d="M8.6 16.5h3.8"/><circle cx="15" cy="16.5" r="1.1" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  termine: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3.5v3"/><path d="M16 3.5v3"/><path d="M3.5 9.5h17"/><circle cx="15.5" cy="15" r="1.2" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  finanzen: '<circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.2a3.5 3.5 0 1 0 0 5.6"/><path d="M8 11h4.4"/><path d="M8 13h4.4"/><circle cx="16.4" cy="12" r="1" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  statistik: '<path d="M4 4v14.5A1.5 1.5 0 0 0 5.5 20H20"/><path d="M8.5 16.5v-3.5"/><path d="M12.5 16.5v-6"/><path d="M16.5 16.5v-8"/><circle cx="16.5" cy="5.4" r="1.1" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  fristen: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12"/><path d="M12 12l3.2 2"/><circle cx="12" cy="12" r="1.2" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  schreiben: '<path d="M16 4.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8l-4.1.7.7-4.1Z"/><path d="M14.4 6.2l3.4 3.4"/><path d="M12.5 20h5"/><circle cx="20.1" cy="20" r="1.1" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  archiv: '<path d="M3.5 7a2.5 2.5 0 0 1 2.5-2.5h3.2c.7 0 1.3.3 1.7.8l1 1.2c.4.5 1 .8 1.7.8H18a2.5 2.5 0 0 1 2.5 2.5v8.2a2.5 2.5 0 0 1-2.5 2.5H6a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M3.5 10.3h17"/><circle cx="7" cy="7.6" r="1.1" fill="var(--icon-dot,#4F6785)" stroke="none"/>',
  leitung: '<circle cx="9.5" cy="8.5" r="3.2"/><path d="M3.8 20v-.8a4.8 4.8 0 0 1 4.8-4.8h1.8a4.8 4.8 0 0 1 4.8 4.8v.8"/><path d="M15 5.6a3 3 0 0 1 0 5.8"/><path d="M17.6 14.6a4.6 4.6 0 0 1 2.6 4.2v1.2"/><circle cx="20.2" cy="5" r="1.1" fill="var(--icon-dot,#4F6785)" stroke="none"/>'
};
const TEAM = [
  { id: "sekretariat", name: "Lena Krüger", rolle: "Sekretariat", bereiche: "Posteingang · prüft · Gemini · verteilt", route: "documents", kleid: "#4F6785", look: { haar: "dutt", acc: "headset", haut: 2, haarF: 0, arbeit: "tippen" } },
  { id: "termine", name: "Jonas Weber", rolle: "Terminmanager", bereiche: "Kalender · Termine · Erinnerungen", route: "calendar", kleid: "#2E4468", look: { haar: "kurz", acc: "brille", haut: 0, haarF: 1, arbeit: "tippen" } },
  { id: "finanzen", name: "Miriam Hoffmann", rolle: "Finanzexpertin", bereiche: "Finanzen · Finanzierung · Konten", route: "finance", kleid: "#7D90A8", look: { haar: "lang", acc: null, haut: 1, haarF: 2, arbeit: "analyse" } },
  { id: "statistik", name: "David Schulz", rolle: "Statistik & Überblick", bereiche: "Statistik · Verträge & Fixkosten · Konten & Vermögen · Notizen · Monatsbericht", route: "stats", kleid: "#5F7591", look: { haar: "locken", acc: "brille", haut: 3, haarF: 3, arbeit: "analyse" } },
  { id: "fristen", name: "Anna Lorenz", rolle: "Fristen & Aufgaben", bereiche: "Fristen · Aufgaben · Vorgänge", route: "tasks", kleid: "#3B5272", look: { haar: "seite", acc: null, haut: 2, haarF: 4, arbeit: "pruefen" } },
  { id: "schreiben", name: "Felix Wagner", rolle: "Schreibbüro", bereiche: "Briefe · E-Mails · Vorlagen", route: "letters", kleid: "#A9B8CA", look: { haar: "kurz", acc: null, haut: 4, haarF: 1, arbeit: "tippen" } },
  { id: "archiv", name: "Clara Neumann", rolle: "Archiv", bereiche: "Dokumente · Scanner · Kopien", route: "scan", kleid: "#C5D0DC", look: { haar: "dutt", acc: "brille", haut: 0, haarF: 2, arbeit: "pruefen" } },
  { id: "leitung", name: "Martin Richter", rolle: "Büroleitung", bereiche: "Personen & Vollmachten · Adressbuch · Tresor", route: "persons", kleid: "#1B2A44", look: { haar: "kurz", acc: "brille", haut: 1, haarF: 4, arbeit: "pruefen" } }
];

/* ---------- Hilfen ---------- */
const C = h => new THREE.Color(h);
const matCache = {};
function mat(farbe, opt) { const k = farbe + JSON.stringify(opt || {}); if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: C(farbe), roughness: .85, metalness: .02 }, opt || {})); return matCache[k]; }
function B(w, h, d, m, x, y, z, p, sch) { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof m === "string" ? mat(m) : m); o.position.set(x, y, z); if (sch !== false) { o.castShadow = true; o.receiveShadow = true; } p.add(o); return o; }
function Z(rt, rb, h, m, seg, x, y, z, p) { const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 14), typeof m === "string" ? mat(m) : m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; p.add(o); return o; }
function G(x, y, z, p, ry) { const g = new THREE.Group(); g.position.set(x || 0, y || 0, z || 0); if (ry) g.rotation.y = ry; if (p) p.add(g); return g; }
function leinwand(w, h, malen) { const c = document.createElement("canvas"); c.width = w; c.height = h; malen(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t; }
const zufall = (a, b) => a + Math.random() * (b - a), wahl = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const svgIcon = (id, dot) => `<svg class="i" viewBox="0 0 24 24" style="--icon-dot:${dot || "#A9B8CA"}">${ICON[id]}</svg>`;

/* ---------- Szene ---------- */
const el = document.getElementById("szene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(C(F.klar));
renderer.shadowMap.enabled = EINST.qual !== "leicht"; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(devicePixelRatio, EINST.qual === "hoch" ? 2 : 1.25));
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
if (DUNKEL) scene.fog = new THREE.Fog(C(F.klar), 30, 70);
const cam = new THREE.PerspectiveCamera(32, 1, .1, 200);
scene.add(new THREE.HemisphereLight(C(F.himmel), C(F.erde), F.licht));
const sonne = new THREE.DirectionalLight(C(DUNKEL ? "#C9D3DE" : "#FFFFFF"), F.sonne);
sonne.position.set(-8, 18, 10); sonne.castShadow = true; sonne.shadow.mapSize.set(EINST.qual === "hoch" ? 4096 : 2048, EINST.qual === "hoch" ? 4096 : 2048); sonne.shadow.bias = -.0003; sonne.shadow.normalBias = .025;
Object.assign(sonne.shadow.camera, { left: -14, right: 14, top: 11, bottom: -11, near: 1, far: 60 });
scene.add(sonne);
const lampen = [];
function lampe(x, y, z, farbe, staerke, weite) { if (!DUNKEL) return; const l = new THREE.PointLight(C(farbe || "#FFE6C4"), staerke || .8, weite || 6, 2); l.position.set(x, y, z); scene.add(l); lampen.push(l); }

/* ---------- Raum 20 × 14 m ---------- */
const RX = 10, RZ = 7, WH = 2.8;
const raum = G(0, 0, 0, scene);
const dielen = leinwand(1024, 1024, (g, w, h) => {
