<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Home – Scannen</title>
<style>
  :root{--b:#16324f;--a:#2563eb;--ok:#15803d;--bg:#f3f5f9;--line:#e3e7ee;--mut:#6b7280}
  *{box-sizing:border-box} body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1c2533}
  header{background:var(--b);color:#fff;padding:16px 18px;font-weight:700;font-size:18px}
  main{padding:16px;max-width:560px;margin:auto}
  .big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:18px;color:#fff;background:var(--a);margin-bottom:12px}
  .sec{background:#fff;color:#1c2533;border:1px solid var(--line)}
  .done{background:var(--ok)}
  input[type=file]{display:none}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .pg{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#dde3ea;border:1px solid var(--line)}
  .pg img{width:100%;height:100%;object-fit:cover} .pg span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px}
  .pdf{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--b)}
  .hint{color:var(--mut);font-size:14px} .msg{padding:12px 14px;border-radius:10px;margin:10px 0;font-size:15px}
  .msg.ok{background:#e7f6ec;color:#166534} .msg.err{background:#fdecec;color:#991b1b}
</style>
</head>
<body>
<header>Office Home · Scannen</header>
<main>
  <p class="hint">Fotografiere jede Seite einzeln, möglichst auf dunklem Untergrund. Office Home schneidet die Seite zu und macht sie gut lesbar. Alle Seiten eines Briefes ergeben ein PDF.</p>
  <label class="big" for="cam">📷 Seite fotografieren</label>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <label class="big sec" for="files">📁 Fotos oder PDF auswählen</label>
  <input id="files" type="file" accept="image/*,application/pdf" multiple>
  <div id="msg"></div>
  <div class="grid" id="grid"></div>
  <button class="big done" id="done" disabled>✓ Fertig – Brief abschließen</button>
  <p class="hint">Danach kannst du direkt den nächsten Brief fotografieren. Die Verbindung läuft nur in deinem WLAN.</p>
</main>
<script>
const T = new URLSearchParams(location.search).get('t');
let batch = Date.now().toString(36), count = 0, busy = 0;
const $ = s => document.querySelector(s);
function msg(t, cls){ $('#msg').innerHTML = t ? `<div class="msg ${cls || 'ok'}">${t}</div>` : ''; }
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const max = 2400, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht gelesen werden')), 'image/jpeg', 0.88); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = url;
  });
}
async function send(file){
  busy++; $('#done').disabled = true; count++;
  const n = count, tile = document.createElement('div'); tile.className = 'pg';
  const isPdf = file.type === 'application/pdf';
  tile.innerHTML = isPdf ? `<div class="pg pdf">PDF</div><span>${n} …</span>` : `<img src="${URL.createObjectURL(file)}"><span>${n} …</span>`;
  $('#grid').appendChild(tile);
  try {
    const body = isPdf ? file : await shrink(file);
    const r = await fetch(`/upload?t=${T}&b=${batch}`, {method:'POST', headers:{'content-type': isPdf ? 'application/pdf' : 'image/jpeg', 'x-name': encodeURIComponent(file.name || 'Handy-Foto')}, body});
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Fehler');
    tile.querySelector('span').textContent = n + ' ✓'; msg('Seite ' + n + ' ist in Office Home angekommen.');
  } catch (e) { tile.querySelector('span').textContent = n + ' ✗'; msg('Senden fehlgeschlagen: ' + e.message + ' – ist Office Home noch geöffnet und im selben WLAN?', 'err'); }
  busy--; $('#done').disabled = busy > 0 || !count;
}
$('#cam').onchange = e => { for (const f of e.target.files) send(f); e.target.value = ''; };
$('#files').onchange = e => { for (const f of e.target.files) send(f); e.target.value = ''; };
$('#done').onclick = async () => {
  await fetch(`/done?t=${T}&b=${batch}`, {method:'POST'});
  msg('Fertig! ' + count + ' Seite(n) liegen jetzt im Scanner von Office Home. Du kannst den nächsten Brief fotografieren.');
  batch = Date.now().toString(36); count = 0; $('#grid').innerHTML = ''; $('#done').disabled = true;
};
</script>
</body>
</html>
