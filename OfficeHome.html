<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Home</title>
<style>
:root{
  --bg:#f3f5f9; --panel:#fff; --ink:#1c2533; --muted:#6b7280; --line:#e3e7ee;
  --brand:#16324f; --brand2:#21486f; --accent:#2563eb; --accent-soft:#e8f0fe;
  --danger:#dc2626; --danger-soft:#fdecec; --warn:#b45309; --warn-soft:#fef3c7;
  --ok:#15803d; --ok-soft:#e7f6ec; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
a{color:var(--accent);text-decoration:none}
button{font:inherit}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
/* Sidebar */
.side{background:var(--brand);color:#cdd9e6;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:grid;place-items:center}
.nav{padding:6px 10px;flex:1}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#8ea6c0;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;color:#d6e1ec;padding:8px 10px;border-radius:8px;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--brand2);color:#fff;box-shadow:inset 3px 0 0 #60a5fa}
.nav a .cnt{margin-left:auto;background:#dc2626;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.side .foot{padding:12px 18px;font-size:11px;color:#8ea6c0;border-top:1px solid rgba(255,255,255,.08)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Main */
.mainwrap{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:12px 26px;background:var(--panel);border-bottom:1px solid var(--line)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.search{margin-left:auto;position:relative}
.search input{width:280px;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:24px 26px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.head{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head .grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400;font-size:13px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.red .v{color:var(--danger)} .kpi.amber .v{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f8fb}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#1d4ed8}
.btn.dan{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eef2f7}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:#f8fafc}
.t td.act{text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f5;color:#374151;white-space:nowrap}
.badge.red{background:var(--danger-soft);color:var(--danger)}
.badge.amber{background:var(--warn-soft);color:var(--warn)}
.badge.green{background:var(--ok-soft);color:var(--ok)}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:#374151}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.list .row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #f0f2f6}
.list .row:last-child{border-bottom:none}
.list .row .grow{flex:1;min-width:0}
.ttl{font-weight:600}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.banner.red{background:var(--danger-soft);color:#991b1b}
.banner.amber{background:var(--warn-soft);color:#92400e}
.banner.blue{background:var(--accent-soft);color:#1e3a8a}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs a{padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tabs a.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.bar{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.chk-row input{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.pcard{border-top:4px solid var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--muted)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.note{background:#fffbea;border:1px solid #f3e3a1;border-radius:var(--radius);padding:14px;cursor:pointer;min-height:120px}
.note h4{margin:0 0 6px}
.note p{margin:0;white-space:pre-wrap;color:#4b5563;font-size:13px;max-height:160px;overflow:hidden}
.drop{border:2px dashed #c7d2e0;border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted);margin-bottom:16px;background:#fafcff}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--ink)}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:12px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
.modal form{padding:16px 20px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.modal .acts{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.modal .acts .sp{flex:1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;color:#4b5563;font-weight:600}
.fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid #d5dbe4;border-radius:8px;background:#fff;width:100%}
.fld textarea{resize:vertical}
.fld .hint{font-size:11.5px;color:var(--muted)}
.fld.cb{flex-direction:row;align-items:center;gap:8px}
.fld.cb label{font-weight:400;color:var(--ink);font-size:13.5px}
.fld.cb input{width:17px;height:17px}
input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#93c5fd}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:8px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* Brief editor */
.brief{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);gap:18px;align-items:start}
.brief>*{min-width:0}
.brief .ed .card{padding:14px 16px}
.brief .ed .fld{margin-bottom:10px}
.brief .ed .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brief .ed .two .fld{margin-bottom:10px}
.ph{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.ph button{border:1px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:6px;font-size:11.5px;padding:2px 7px;cursor:pointer}
.pv{position:sticky;top:0}
.pv .tool{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.pvbox{background:#d9dee7;border-radius:var(--radius);padding:18px;overflow:hidden;width:100%}
.pvscale{transform-origin:top left}
.pvwarn{font-size:12.5px;color:var(--warn);margin-left:auto}
.imgprev{max-height:60px;max-width:200px;border:1px dashed #cbd5e1;padding:4px;background:#fff;border-radius:6px;display:block;margin:6px 0}
/* Letter (DIN 5008 Form B) */
.letter{position:relative;width:210mm;min-height:297mm;background:#fff;color:#000;padding:0 20mm 0 25mm;
  font-family:var(--lf,Arial),Arial,sans-serif;font-size:var(--ls,11pt);line-height:1.38;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.letter .pgend{position:absolute;left:0;right:0;top:279mm;border-top:1px dashed #f87171}
.letter .l-head{position:absolute;left:25mm;right:20mm;top:14mm}
.letter .l-head .n{font-size:15pt;font-weight:700;letter-spacing:.2px}
.letter .l-head .a{font-size:8.5pt;color:#333;margin-top:1mm}
.letter .l-field{position:absolute;left:20mm;top:45mm;width:85mm;height:45mm}
.letter .l-zone{height:17.7mm;padding-left:5mm;position:relative}
.letter .l-ret{font-size:7pt;padding-top:1.5mm;color:#222;max-width:80mm}
.letter .l-field.hasm .l-ret{max-width:38mm}
.letter .l-verm{font-size:9pt;font-weight:700;margin-top:1.5mm}
.letter .l-marke{position:absolute;right:0;top:0;max-width:42mm;max-height:17.5mm}
.letter .l-addr{height:27.3mm;padding-left:5mm;overflow:hidden}
.letter .l-info{position:absolute;left:125mm;top:50mm;width:75mm;font-size:8.5pt;border-collapse:collapse}
.letter .l-info td{padding:0 2mm .7mm 0;vertical-align:top}
.letter .l-info td:first-child{color:#444;white-space:nowrap}
.letter .l-body{padding-top:98.5mm;padding-bottom:10mm}
.letter .l-subj{font-weight:700;margin-bottom:7mm}
.letter .l-body p{margin:0 0 3.6mm}
.letter .l-sigwrap{position:relative;margin-top:1mm}
.letter .l-sig{height:16mm;display:flex;align-items:flex-end}
.letter .l-sig img{max-height:16mm;max-width:60mm}
.letter .l-stamp{position:absolute;left:58mm;top:-6mm;max-height:28mm;max-width:42mm;opacity:.92}
.letter .l-anl{margin-top:7mm}
.letter .l-anl b{display:block}
.letter .fold{position:absolute;left:4mm;width:5mm;border-top:.3pt solid #888}
.letter .hole{position:absolute;left:4mm;width:8mm;border-top:.3pt solid #888}
.letter mark{background:#fde68a;color:inherit;padding:0 1px;border-radius:2px}
.letter{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.letter.d-modern .l-head{border-bottom:1.2pt solid var(--acc);padding-bottom:2.5mm}
.letter.d-modern .l-head .n{color:var(--acc);font-size:17pt}
.letter.d-modern .l-subj{color:var(--acc)}
.letter.d-elegant .l-head{left:20mm;right:20mm;text-align:center}
.letter.d-elegant .l-head .n{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:18pt;letter-spacing:2.5px;text-transform:uppercase}
.letter.d-elegant .l-head .a{border-top:.5pt solid #555;border-bottom:.5pt solid #555;padding:1mm 0;margin-top:2mm;letter-spacing:.6px}
.letter.d-elegant .l-subj{font-weight:400;font-variant:small-caps;letter-spacing:.5px;font-size:1.08em}
.letter.d-sachlich .l-head{text-align:right}
.letter.d-sachlich .l-head .n{font-size:12pt}
.letter.d-sachlich .l-info td:first-child{font-weight:700;color:#000}
.letter.d-sachlich .l-subj{border-bottom:.5pt solid #000;padding-bottom:1.5mm}
.letter.d-band .l-head{left:0;right:0;top:0;height:30mm;box-sizing:border-box;padding:9mm 20mm 0 25mm;background:var(--acc);color:#fff}
.letter.d-band .l-head .a{color:#fff;opacity:.9}
.letter.d-band .l-subj{color:var(--acc)}
.letter.d-linie::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3mm;background:var(--acc)}
.letter.d-linie .l-head .n{color:var(--acc)}
.letter.d-linie .l-head .a{color:#555}
.letter.d-linie .l-subj{border-left:1mm solid var(--acc);padding-left:2.5mm;margin-left:-3.5mm}
.updchip{display:block;margin:0 12px 10px;padding:8px 10px;border-radius:8px;background:#f59e0b;color:#1f2937;font-size:12.5px;font-weight:600;text-decoration:none;text-align:center}
.dsgrid{display:flex;flex-wrap:wrap;gap:14px}
.dstile{border:2px solid var(--line,#d9dee7);border-radius:10px;padding:8px;background:transparent;cursor:pointer;text-align:center;font:inherit;color:inherit}
.dstile.on{border-color:var(--pri,#2563eb);background:rgba(37,99,235,.06)}
.dstile .pv{width:168px;height:238px;overflow:hidden;text-align:left;margin-bottom:6px;border:1px solid #e5e7eb;background:#fff}
.dstile .pv .letter{transform:scale(.21);transform-origin:top left;box-shadow:none;pointer-events:none}
/* Monatsbericht */
.rpwrap{background:#d9dee7;border-radius:var(--radius);padding:18px;overflow-x:auto}
.report{background:#fff;color:#000;width:210mm;margin:0 auto;padding:15mm 18mm;font-family:Arial,Helvetica,sans-serif;font-size:10pt;line-height:1.4;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.report h1{font-size:16pt;margin:0 0 1mm}
.report .rsub{color:#444;font-size:9pt;margin-bottom:6mm}
.report h2{font-size:11.5pt;margin:6mm 0 2mm;padding-bottom:1mm;border-bottom:1.2pt solid #16324f;color:#16324f;break-after:avoid}
.report table{width:100%;border-collapse:collapse;font-size:9.5pt}
.report th{text-align:left;font-weight:700;padding:1.2mm 2mm;border-bottom:.6pt solid #888;background:#f1f4f8}
.report td{padding:1.2mm 2mm;border-bottom:.3pt solid #ccc;vertical-align:top}
.report tr{break-inside:avoid}
.report .num{text-align:right;white-space:nowrap}
.report .none{color:#666;font-style:italic;margin:1mm 0}
.report .over{color:#b91c1c;font-weight:700}
.report .sums{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-bottom:2mm}
.report .sums div{border:.6pt solid #bbb;border-radius:2mm;padding:2mm 3mm}
.report .sums b{display:block;font-size:13pt}
.report .rsig{margin-top:14mm;display:grid;grid-template-columns:1fr 1fr;gap:20mm;font-size:9pt;break-inside:avoid}
.report .rsig div{border-top:.6pt solid #000;padding-top:1.5mm}
#print-root{display:none}
@media print{
  @page{size:A4;margin:15mm 0 18mm 0}
  @page :first{margin:0 0 18mm 0}
  body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .letter{box-shadow:none;min-height:0}
  #print-root .pgend{display:none}
  #print-root mark{background:none}
  #print-root .report{box-shadow:none;width:auto;padding:15mm 18mm 0}
}
@media (max-width:1100px){.brief{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:800px){.app{grid-template-columns:1fr}.side{display:none}.g2,.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark"><svg class="i" viewBox="0 0 24 24" style="color:#fff"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></div>Office Home</div>
    <nav class="nav" id="nav"></nav>
    <div id="updChip"></div>
    <div class="foot">Daten nur auf diesem Computer.<br><a href="#/settings" style="color:#93c5fd">Datensicherung</a></div>
  </aside>
  <div class="mainwrap">
    <div class="top">
      <div class="pills" id="pills"></div>
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Alles durchsuchen … (Enter)" autocomplete="off">
      </div>
    </div>
    <main id="main"></main>
  </div>
</div>
<div id="print-root"></div>
<input type="file" id="hiddenFile" style="display:none">

<script>
'use strict';
/* =========================================================
   Office Home – Familienbüro (offline, lokale Datenhaltung)
   ========================================================= */

// ---------- Hilfsfunktionen ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const z2 = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + z2(d.getMonth() + 1) + '-' + z2(d.getDate());
const today = () => isoDate(new Date());
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; }
function fmtDateLong(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-').map(Number); return `${d}. ${MONATE[m-1]} ${y}`; }
function daysUntil(iso){ return Math.round((new Date(iso + 'T00:00') - new Date(today() + 'T00:00')) / 86400000); }
function addMonths(iso, n){
  const d = new Date(iso + 'T00:00'); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return isoDate(d);
}
const eur = n => (Number(n) || 0).toLocaleString('de-DE', {style:'currency', currency:'EUR'});
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function readAsDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function dataURLtoBlob(u){ return (await fetch(u)).blob(); }
function blobToDataURL(b){ return readAsDataURL(b); }
function pickFile(accept){ return new Promise(res => { const inp = $('#hiddenFile'); inp.value = ''; inp.accept = accept || ''; inp.onchange = () => res(inp.files[0] || null); inp.click(); }); }
async function imageToDataURL(file, maxW = 900){
  const url = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  if (img.width <= maxW) return url;
  const c = document.createElement('canvas'); c.width = maxW; c.height = Math.round(img.height * maxW / img.width);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/png');
}

const ICONS = {

// ---------- Datenbank (IndexedDB, lokal) ----------
const DB = {
  db: null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('officehome', 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('kv'); db.createObjectStore('files'); };
    r.onsuccess = () => { DB.db = r.result; res(); }; r.onerror = () => rej(r.error);
  }); },
  tx(store, mode, fn){ return new Promise((res, rej) => {
    if (!DB.db) return res(undefined);
    const t = DB.db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
  }); },
  get:(s, k) => DB.tx(s, 'readonly', st => st.get(k)),
  put:(s, k, v) => DB.tx(s, 'readwrite', st => st.put(v, k)),
  del:(s, k) => DB.tx(s, 'readwrite', st => st.delete(k)),
  clear:s => DB.tx(s, 'readwrite', st => st.clear())
};
const memFiles = {}; // Fallback ohne IndexedDB
async function fileGet(id){ return DB.db ? DB.get('files', id) : memFiles[id]; }
async function filePut(id, v){ if (DB.db) return DB.put('files', id, v); memFiles[id] = v; }
async function fileDel(id){ if (DB.db) return DB.del('files', id); delete memFiles[id]; }

// ---------- Verträge ----------
const INTERVALS = {monatlich:1, vierteljährlich:3, halbjährlich:6, jährlich:12};
function monthly(c){ return (Number(c.amount) || 0) / (INTERVALS[c.interval] || 1); }
function contractInfo(c){
  if (c.ended) return {state:'beendet'};
  if (!c.end) return {state:'unbefristet', cancelBy:null};
  let end = c.end; const ren = Number(c.renewalMonths) || 0;
  if (ren > 0) { let guard = 0; while (end < today() && guard++ < 600) end = addMonths(end, ren); }
  else if (end < today()) return {state:'abgelaufen', end};
  const notice = Number(c.noticeMonths) || 0;
  return {state:'laufend', end, cancelBy: notice ? addMonths(end, -notice) : end};
}

function dueBadge(iso){
  if (!iso) return '<span class="badge">ohne Datum</span>';
  const d = daysUntil(iso);
  if (d < 0) return `<span class="badge red">überfällig (${fmtDate(iso)})</span>`;
  if (d === 0) return `<span class="badge red">heute</span>`;
  if (d === 1) return `<span class="badge amber">morgen</span>`;
  if (d <= 7) return `<span class="badge amber">in ${d} Tagen · ${fmtDate(iso)}</span>`;
  return `<span class="badge">${fmtDate(iso)}</span>`;
}
function deadlineItems(){
  const items = [];
  for (const t of byPerson(S.tasks)) if (!t.done && t.due) items.push({date:t.due, title:t.title, kind:'Aufgabe', personId:t.personId, href:t.caseId ? '#/case/' + t.caseId : '#/tasks', taskId:t.id});
  for (const c of byPerson(S.contracts)) { const i = contractInfo(c); if (i.cancelBy && daysUntil(i.cancelBy) <= S.settings.contractDays) items.push({date:i.cancelBy, title:'Kündigungsfrist: ' + c.provider, kind:'Vertrag', personId:c.personId, href:'#/contracts'}); }
  return items.sort((a, b) => a.date.localeCompare(b.date));
}

function fieldHTML(f, v){
  const id = 'f_' + f.k;
  if (f.t === 'checkbox') return `<div class="fld cb ${f.full ? 'full' : ''}"><input type="checkbox" id="${id}" name="${f.k}" ${v ? 'checked' : ''}><label for="${id}">${esc(f.l)}</label></div>`;
  let inp;
  switch (f.t) {
    case 'textarea': inp = `<textarea id="${id}" name="${f.k}" rows="${f.rows || 4}">${esc(v)}</textarea>`; break;
    case 'select': inp = `<select id="${id}" name="${f.k}">${optHTML(f.o, v)}</select>`; break;
    case 'person': inp = `<select id="${id}" name="${f.k}">${optHTML(personOpts(!f.noAll), v)}</select>`; break;
    case 'contact': inp = `<select id="${id}" name="${f.k}">${optHTML(contactOpts(), v)}</select>`; break;
    case 'case': inp = `<select id="${id}" name="${f.k}">${optHTML(caseOpts(), v)}</select>`; break;
    case 'file': inp = `<input type="file" id="${id}" name="${f.k}">`; break;
    default: inp = `<input type="${f.t || 'text'}" id="${id}" name="${f.k}" value="${esc(v)}" ${f.step ? `step="${f.step}"` : ''}>`;
  }
  return `<div class="fld ${f.full ? 'full' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' *' : ''}</label>${inp}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}
function openForm({title, fields, data = {}, onSave, onDelete, saveLabel}){
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><form id="mform" autocomplete="off">${fields.map(f => fieldHTML(f, data[f.k] ?? f.def ?? '')).join('')}</form>
    <div class="acts">${onDelete ? '<button class="btn dan" data-m="del">Löschen</button>' : ''}<span class="sp"></span><button class="btn" data-m="cancel">Abbrechen</button><button class="btn pri" data-m="ok">${esc(saveLabel || 'Speichern')}</button></div></div>`;
  document.body.appendChild(bg);
  const form = $('#mform', bg);
  const first = form.querySelector('input:not([type=checkbox]),textarea,select'); if (first) first.focus();
  const submit = async () => {
    const out = {};
    for (const f of fields) {
      const el = form.elements[f.k]; if (!el) continue;
      if (f.t === 'checkbox') out[f.k] = el.checked;
      else if (f.t === 'file') out[f.k] = el.files[0] || null;
      else if (f.t === 'number') out[f.k] = el.value === '' ? '' : parseFloat(el.value);
      else out[f.k] = el.value.trim();
      if (f.req && !out[f.k]) { el.focus(); el.style.borderColor = '#dc2626'; return; }
    }
    const r = await onSave(out); if (r !== false) closeModal();
  };
  bg.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (e.target === bg) return closeModal(); if (!b) return; e.preventDefault();
    if (b.dataset.m === 'cancel') closeModal();
    if (b.dataset.m === 'ok') submit();
    if (b.dataset.m === 'del' && confirm('Wirklich löschen?')) { onDelete(); closeModal(); }
  });
  form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'file') { e.preventDefault(); submit(); } });
  return form;
}

      if (mk && o.deadline && !S.tasks.some(t => t.docId === o.id && t.due === o.deadline))
        S.tasks.push({id:uid(), title:'Frist: ' + o.title, due:o.deadline, personId:o.personId, caseId:o.caseId, docId:o.id, priority:'hoch', done:false, created:today()});
      if (o.caseId) { const c = getCase(o.caseId); if (c && !d) c.log.push({id:uid(), date:today(), text:'Dokument hinzugefügt: ' + o.title}); }
      upsert('documents', o); render();
    },
    onDelete: d ? async () => { if (d.fileId) await fileDel(d.fileId); remove('documents', d.id); render(); } : null});
}
async function openDoc(d){
  const f = d.fileId && await fileGet(d.fileId);
  if (!f) return toast('Keine Datei hinterlegt');
  if (DESKTOP) { const r = await window.officeHome.openFile(f.name, await f.blob.arrayBuffer()); if (!r.ok) toast('Datei konnte nicht geöffnet werden'); return; }
  const url = URL.createObjectURL(f.blob); const w = window.open(url, '_blank');
  if (!w) download(f.name, f.blob);
}

function toggleTask(t){
  if (!t.done && t.repeat && t.due) {
    t.lastDone = today(); t.due = addMonths(t.due, Number(t.repeat)); toast('Erledigt – nächster Termin: ' + fmtDate(t.due));
  } else { t.done = !t.done; t.doneAt = t.done ? today() : ''; }
  if (t.done && t.caseId) { const c = getCase(t.caseId); if (c) c.log.push({id:uid(), date:today(), text:'Erledigt: ' + t.title}); }
  save(); render();
}

                  .sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 6);
  return `
  <div class="head"><div class="grow"><h1>Übersicht</h1><p class="sub" style="margin:0">${fmtDateLong(today())}${UI.person !== 'all' ? ' · ' + esc(getPerson(UI.person)?.role) : ''}</p></div>
    <button class="btn" data-act="newTask">${icon('plus')}Frist</button><button class="btn" data-act="newCase">${icon('plus')}Vorgang</button><button class="btn" data-act="newDoc">${icon('plus')}Dokument</button><a class="btn pri" href="#/brief/new">${icon('pen')}Brief schreiben</a></div>
  ${setupMissing ? `<div class="banner blue">${icon('users')}<div><b>Willkommen bei Office Home!</b> Trage zuerst <a href="#/settings">deine eigenen Daten</a> (als Bevollmächtigter) und die <a href="#/persons">Daten deiner Eltern</a> ein – dann werden Briefe automatisch richtig ausgefüllt.</div></div>` : ''}
  ${overdue.length ? `<div class="banner red">${icon('clock')}<div><b>${overdue.length} überfällige Frist${overdue.length > 1 ? 'en' : ''}!</b> ${overdue.slice(0, 3).map(i => esc(i.title)).join(' · ')}</div></div>` : ''}
  ${needBackup && !setupMissing ? `<div class="banner amber">${icon('save')}<div>${lb ? 'Letzte Datensicherung am ' + fmtDate(lb) + '.' : 'Noch keine Datensicherung erstellt.'} <a href="#" data-act="backup">Jetzt sichern</a></div></div>` : ''}
  <div class="kpis">
    <div class="kpi ${overdue.length ? 'red' : ''}" data-go="#/tasks"><div class="l">Überfällig</div><div class="v">${overdue.length}</div></div>
    <div class="kpi ${week.length ? 'amber' : ''}" data-go="#/tasks"><div class="l">Fällig in 7 Tagen</div><div class="v">${week.length}</div></div>
    <div class="kpi" data-go="#/cases"><div class="l">Offene Vorgänge</div><div class="v">${openCases.length}</div><div class="l">${waiting.length} warten auf Antwort</div></div>
    <div class="kpi" data-go="#/contracts"><div class="l">Fixkosten / Monat</div><div class="v">${eur(mon)}</div><div class="l">${eur(mon * 12)} im Jahr</div></div>
    <div class="kpi ${cancelSoon.length ? 'amber' : ''}" data-go="#/contracts"><div class="l">Kündigungsfristen (${S.settings.contractDays} T.)</div><div class="v">${cancelSoon.length}</div></div>
    <div class="kpi" data-go="#/documents"><div class="l">Dokumente</div><div class="v">${byPerson(S.documents).length}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>${icon('clock')}Anstehende Fristen <a class="r" href="#/tasks">alle anzeigen</a></h3>
      <div class="list">${soon.length ? soon.slice(0, 9).map(i => `<div class="row">${i.taskId ? `<span class="chk-row"><input type="checkbox" data-act="toggleTask" data-id="${i.taskId}" title="erledigt"></span>` : `<span class="badge blue">Vertrag</span>`}
        <div class="grow"><a class="ttl trunc" href="${i.href}" style="color:inherit;display:block">${esc(i.title)}</a><div class="small">${personChip(i.personId)}</div></div>${dueBadge(i.date)}</div>`).join('') : '<div class="empty">Keine Fristen in den nächsten 30 Tagen 🎉</div>'}</div></div>
    <div class="card"><h3>${icon('folder')}Offene Vorgänge <a class="r" href="#/cases">alle anzeigen</a></h3>
      <div class="list">${openCases.length ? openCases.slice(0, 8).map(c => `<div class="row"><div class="grow"><a class="ttl trunc" href="#/case/${c.id}" style="color:inherit;display:block">${esc(c.title)}</a>
        <div class="small muted">${personChip(c.personId)} ${c.contactId ? '· ' + esc(getContact(c.contactId)?.name || '') : ''} ${c.ref ? '· Az. ' + esc(c.ref) : ''}</div></div>${statusBadge(c.status)}</div>`).join('') : '<div class="empty">Keine offenen Vorgänge</div>'}</div></div>
  </div>
  <div class="grid ${persons.length > 1 ? 'g2' : ''}">
    ${persons.map(p => { const pc = S.cases.filter(c => c.personId === p.id && c.status !== 'erledigt').length;
      const nt = S.tasks.filter(t => t.personId === p.id && !t.done && t.due).sort((a, b) => a.due.localeCompare(b.due))[0];
      const pm = S.contracts.filter(c => c.personId === p.id && !c.ended).reduce((s, c) => s + monthly(c), 0);
      const pa = S.assets.filter(a => a.personId === p.id).reduce((s, a) => s + (Number(a.value) || 0), 0);
      return `<div class="card pcard" style="border-top-color:${esc(p.color)}"><h3><span class="dot" style="background:${esc(p.color)}"></span>${esc(p.role)}: ${esc(personName(p))}<a class="r" href="#/persons">Details</a></h3>
        <div class="kv"><div>Vollmacht</div><div>${p.poaDate ? 'seit ' + fmtDate(p.poaDate) + (p.poaScope ? ' · ' + esc(p.poaScope) : '') : '<span class="badge amber">nicht eingetragen</span>'}</div>
        <div>Offene Vorgänge</div><div>${pc}</div><div>Nächste Frist</div><div>${nt ? esc(nt.title) + ' ' + dueBadge(nt.due) : '—'}</div>
        <div>Fixkosten / Monat</div><div>${eur(pm)}</div><div>Vermögen (Saldo)</div><div>${eur(pa)}</div></div></div>`; }).join('')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>${icon('receipt')}Fixkosten nach Kategorie <span class="r muted">pro Monat</span></h3>
      ${cats.length ? cats.map(([k, v]) => `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between" class="small"><span>${esc(k)}</span><b>${eur(v)}</b></div><div class="bar"><span style="width:${Math.max(3, v / maxCat * 100)}%"></span></div></div>`).join('') : '<div class="empty">Noch keine Verträge erfasst</div>'}</div>
    <div class="card"><h3>${icon('file')}Zuletzt hinzugefügt</h3><div class="list">${recent.length ? recent.map(r => `<div class="row"><span class="badge">${r.t}</span><div class="grow"><a class="trunc" style="display:block;color:inherit" href="${r.href}">${esc(r.title)}</a></div>${personChip(r.p)}<span class="small muted">${fmtDate(r.date)}</span></div>`).join('') : '<div class="empty">Noch nichts vorhanden</div>'}</div></div>
  </div>`;
};
function statusBadge(s){ const m = {'offen':'blue', 'in Bearbeitung':'amber', 'wartet auf Antwort':'amber', 'erledigt':'green'}; return `<span class="badge ${m[s] || ''}">${esc(s || 'offen')}</span>`; }

// Vorgänge
VIEWS.cases = () => {
  let list = byPerson(S.cases);
  list = UI.caseTab === 'open' ? list.filter(c => c.status !== 'erledigt') : list.filter(c => c.status === 'erledigt');
  const prio = {hoch:0, normal:1, niedrig:2};
  list.sort((a, b) => (prio[a.priority] ?? 1) - (prio[b.priority] ?? 1) || (b.start || '').localeCompare(a.start || ''));
  return `<div class="head"><div class="grow"><h1>Vorgänge</h1><p class="sub" style="margin:0">Jede Angelegenheit (Antrag, Bescheid, Streitfall …) als eigene Akte – mit Schritten, Fristen, Dokumenten, Briefen und Verlauf.</p></div><button class="btn pri" data-act="newCase">${icon('plus')}Neuer Vorgang</button></div>
  <div class="tabs"><a class="${UI.caseTab === 'open' ? 'on' : ''}" data-act="caseTab" data-id="open">Offen</a><a class="${UI.caseTab === 'done' ? 'on' : ''}" data-act="caseTab" data-id="done">Erledigt</a></div>
  <div class="card" style="padding:6px 8px">${list.length ? `<table class="t"><tr><th>Vorgang</th><th>Person</th><th>Behörde / Stelle</th><th>Aktenzeichen</th><th>Fortschritt</th><th>Nächste Frist</th><th>Status</th></tr>
  ${list.map(c => { const steps = c.steps || []; const done = steps.filter(s => s.done).length; const nt = S.tasks.filter(t => t.caseId === c.id && !t.done && t.due).sort((a, b) => a.due.localeCompare(b.due))[0];
    return `<tr class="click" data-go="#/case/${c.id}"><td><b>${esc(c.title)}</b>${c.priority === 'hoch' ? ' <span class="badge red">hoch</span>' : ''}</td><td>${personChip(c.personId)}</td><td>${esc(getContact(c.contactId)?.name || '')}</td><td>${esc(c.ref || '')}</td>
    <td style="min-width:110px">${steps.length ? `<div class="bar"><span style="width:${done / steps.length * 100}%"></span></div><span class="small muted">${done}/${steps.length} Schritte</span>` : '<span class="muted small">—</span>'}</td><td>${nt ? dueBadge(nt.due) : '<span class="muted small">—</span>'}</td><td>${statusBadge(c.status)}</td></tr>`; }).join('')}</table>`
  : `<div class="empty">${UI.caseTab === 'open' ? 'Keine offenen Vorgänge. Lege z. B. „Pflegegrad beantragen“ mit fertiger Schritte-Vorlage an.' : 'Noch keine erledigten Vorgänge.'}</div>`}</div>`;
};
VIEWS.case = id => {
  const c = getCase(id); if (!c) return '<div class="empty">Vorgang nicht gefunden. <a href="#/cases">Zurück</a></div>';
  const tasks = S.tasks.filter(t => t.caseId === c.id).sort((a, b) => (a.done - b.done) || (a.due || '9').localeCompare(b.due || '9'));
  const docs = S.documents.filter(d => d.caseId === c.id); const letters = S.letters.filter(l => l.caseId === c.id);
  const ct = getContact(c.contactId);
  return `<div class="head"><div class="grow"><a href="#/cases" class="small">← Vorgänge</a><h1>${esc(c.title)}</h1>
    <div class="small muted">${personChip(c.personId)} ${ct ? '· ' + esc(ct.name) : ''} ${c.ref ? '· Az. ' + esc(c.ref) : ''} · begonnen ${fmtDate(c.start)}</div></div>
    <select class="btn" data-chg="caseStatus" data-id="${c.id}">${optHTML(CASE_STATUS, c.status)}</select>
    <button class="btn" data-act="editCase" data-id="${c.id}">Bearbeiten</button><a class="btn pri" href="#/brief/new?case=${c.id}">${icon('pen')}Brief zu diesem Vorgang</a></div>
  <div class="grid g2">
    <div>
      ${c.description ? `<div class="card"><h3>Beschreibung</h3><div style="white-space:pre-wrap">${esc(c.description)}</div></div>` : ''}
      <div class="card"><h3>Schritte</h3><div class="list">${(c.steps || []).map(s => `<div class="row chk-row ${s.done ? 'done' : ''}"><input type="checkbox" ${s.done ? 'checked' : ''} data-act="toggleStep" data-id="${c.id}" data-sid="${s.id}"><div class="grow ttl" style="font-weight:400">${esc(s.text)}</div><button class="btn ghost sm" data-act="delStep" data-id="${c.id}" data-sid="${s.id}">✕</button></div>`).join('') || '<div class="muted small" style="padding:6px 0">Noch keine Schritte.</div>'}</div>
        <div style="display:flex;gap:8px;margin-top:10px"><input id="newStep" placeholder="Neuer Schritt …" style="flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px"><button class="btn" data-act="addStep" data-id="${c.id}">Hinzufügen</button></div></div>
      <div class="card"><h3>${icon('clock')}Fristen & Aufgaben <button class="btn sm r" data-act="newTask" data-case="${c.id}">${icon('plus')}Frist</button></h3>
        <div class="list">${tasks.map(t => taskRow(t)).join('') || '<div class="muted small">Keine Fristen.</div>'}</div></div>
    </div>
    <div>
      <div class="card"><h3>${icon('file')}Dokumente <button class="btn sm r" data-act="newDoc" data-case="${c.id}">${icon('plus')}Dokument</button></h3>
        <div class="list">${docs.map(d => `<div class="row"><div class="grow"><a href="#" data-act="openDoc" data-id="${d.id}" class="trunc" style="display:block">${esc(d.title)}</a><span class="small muted">${esc(d.category || '')} · ${fmtDate(d.date)}</span></div>${d.deadline ? dueBadge(d.deadline) : ''}</div>`).join('') || '<div class="muted small">Keine Dokumente.</div>'}</div></div>
      <div class="card"><h3>${icon('mail')}Briefe</h3><div class="list">${letters.map(l => `<div class="row"><div class="grow"><a href="#/brief/${l.id}" class="trunc" style="display:block">${esc(letterSubject(l))}</a><span class="small muted">${fmtDate(l.date)}${l.shipping ? ' · ' + esc(l.shipping) : ''}</span></div></div>`).join('') || '<div class="muted small">Noch keine Briefe.</div>'}</div></div>
      <div class="card"><h3>Verlauf / Notizen</h3>
        <div style="display:flex;gap:8px;margin-bottom:10px"><input type="date" id="logDate" value="${today()}" style="padding:6px;border:1px solid var(--line);border-radius:8px"><input id="logText" placeholder="z. B. Anruf beim Sachbearbeiter, Ergebnis …" style="flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px"><button class="btn" data-act="addLog" data-id="${c.id}">Eintragen</button></div>
        <div class="list">${[...(c.log || [])].sort((a, b) => b.date.localeCompare(a.date)).map(l => `<div class="row"><span class="small muted" style="width:80px">${fmtDate(l.date)}</span><div class="grow" style="white-space:pre-wrap">${esc(l.text)}</div><button class="btn ghost sm" data-act="delLog" data-id="${c.id}" data-sid="${l.id}">✕</button></div>`).join('')}</div></div>
    </div>
  </div>`;
};
function taskRow(t){
  return `<div class="row chk-row ${t.done ? 'done' : ''}"><input type="checkbox" ${t.done ? 'checked' : ''} data-act="toggleTask" data-id="${t.id}">
    <div class="grow"><div class="ttl trunc">${esc(t.title)} ${t.priority === 'hoch' ? '<span class="badge red">hoch</span>' : ''} ${t.repeat ? '<span class="badge blue">↻</span>' : ''}</div>
    <div class="small muted">${personChip(t.personId)}${t.caseId && getCase(t.caseId) ? ` · <a href="#/case/${t.caseId}">${esc(getCase(t.caseId).title)}</a>` : ''}${t.notes ? ' · ' + esc(t.notes.slice(0, 60)) : ''}</div></div>
    ${t.done ? `<span class="small muted">erledigt ${fmtDate(t.doneAt)}</span>` : dueBadge(t.due)}<button class="btn ghost sm" data-act="editTask" data-id="${t.id}">Bearbeiten</button></div>`;
}

// Fristen & Aufgaben
VIEWS.tasks = () => {
  const all = byPerson(S.tasks);
  if (UI.taskTab === 'done') {
    const done = all.filter(t => t.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
    return tasksHead() + `<div class="card">${done.length ? `<div class="list">${done.map(taskRow).join('')}</div>` : '<div class="empty">Noch nichts erledigt.</div>'}</div>`;
  }
  const open = all.filter(t => !t.done);
  const groups = [['Überfällig', t => t.due && daysUntil(t.due) < 0], ['Heute', t => t.due && daysUntil(t.due) === 0], ['Nächste 7 Tage', t => t.due && daysUntil(t.due) > 0 && daysUntil(t.due) <= 7],
    ['Später', t => t.due && daysUntil(t.due) > 7], ['Ohne Datum', t => !t.due]];
  const contractsDue = byPerson(S.contracts).map(c => ({c, i:contractInfo(c)})).filter(x => x.i.cancelBy && daysUntil(x.i.cancelBy) <= S.settings.contractDays).sort((a, b) => a.i.cancelBy.localeCompare(b.i.cancelBy));
  return tasksHead() + groups.map(([name, fn]) => { const L = open.filter(fn).sort((a, b) => (a.due || '').localeCompare(b.due || ''));
    return L.length ? `<div class="card"><h3>${name} <span class="badge">${L.length}</span></h3><div class="list">${L.map(taskRow).join('')}</div></div>` : ''; }).join('')
    + (contractsDue.length ? `<div class="card"><h3>${icon('receipt')}Kündigungsfristen von Verträgen</h3><div class="list">${contractsDue.map(x => `<div class="row"><div class="grow"><div class="ttl">${esc(x.c.provider)}</div><div class="small muted">${personChip(x.c.personId)} · Laufzeit bis ${fmtDate(x.i.end)}</div></div>${dueBadge(x.i.cancelBy)}<a class="btn sm" href="${kuendigungLink(x.c)}">Kündigung schreiben</a></div>`).join('')}</div></div>` : '')
    + (!open.length && !contractsDue.length ? '<div class="card"><div class="empty">Keine offenen Fristen 🎉</div></div>' : '');
};
function tasksHead(){
  return `<div class="head"><div class="grow"><h1>Fristen & Aufgaben</h1><p class="sub" style="margin:0">Wiederkehrende Termine (z. B. jährliche Nachweise) mit ↻ werden nach dem Abhaken automatisch neu angesetzt.</p></div>
  <button class="btn" data-act="ics">${icon('cal')}In Kalender exportieren (.ics)</button><button class="btn pri" data-act="newTask">${icon('plus')}Neue Frist</button></div>
  <div class="tabs"><a class="${UI.taskTab === 'open' ? 'on' : ''}" data-act="taskTab" data-id="open">Offen</a><a class="${UI.taskTab === 'done' ? 'on' : ''}" data-act="taskTab" data-id="done">Erledigt</a></div>`;
}
function kuendigungLink(c){ const p = new URLSearchParams({tpl:'kuendigung'}); if (c.personId) p.set('person', c.personId); if (c.contactId) p.set('contact', c.contactId); if (c.customerNo) p.set('kd', c.customerNo); return '#/brief/new?' + p; }

// Verträge
VIEWS.contracts = () => {
  const all = byPerson(S.contracts); const active = all.filter(c => !c.ended);
  const mon = active.reduce((s, c) => s + monthly(c), 0);
  const rows = [...active, ...all.filter(c => c.ended)];
  return `<div class="head"><div class="grow"><h1>Verträge & Fixkosten</h1><p class="sub" style="margin:0">Laufzeiten und Kündigungsfristen werden automatisch berechnet – du wirst rechtzeitig erinnert.</p></div><button class="btn pri" data-act="newContract">${icon('plus')}Neuer Vertrag</button></div>
  <div class="kpis"><div class="kpi"><div class="l">Fixkosten pro Monat</div><div class="v">${eur(mon)}</div></div><div class="kpi"><div class="l">Pro Jahr</div><div class="v">${eur(mon * 12)}</div></div><div class="kpi"><div class="l">Aktive Verträge</div><div class="v">${active.length}</div></div>
  <div class="kpi"><div class="l">Per Lastschrift</div><div class="v">${active.filter(c => c.payment === 'Lastschrift').length}</div></div></div>
  <div class="card" style="padding:6px 8px">${rows.length ? `<table class="t"><tr><th>Anbieter</th><th>Kategorie</th><th>Person</th><th>Kundennr.</th><th style="text-align:right">Betrag</th><th style="text-align:right">/ Monat</th><th>Laufzeit bis</th><th>Kündigen bis</th><th></th></tr>
  ${rows.map(c => { const i = contractInfo(c); return `<tr class="click" data-act="editContract" data-id="${c.id}" style="${c.ended ? 'opacity:.55' : ''}"><td><b>${esc(c.provider)}</b></td><td>${esc(c.category || '')}</td><td>${personChip(c.personId)}</td><td class="small">${esc(c.customerNo || '')}</td>
    <td style="text-align:right">${eur(c.amount)} <span class="small muted">${esc(c.interval || '')}</span></td><td style="text-align:right"><b>${eur(monthly(c))}</b></td>
    <td>${i.state === 'beendet' ? '<span class="badge">beendet</span>' : i.state === 'unbefristet' ? '<span class="small muted">unbefristet</span>' : i.state === 'abgelaufen' ? '<span class="badge">abgelaufen ' + fmtDate(i.end) + '</span>' : fmtDate(i.end)}</td>
    <td>${i.cancelBy ? dueBadge(i.cancelBy) : ''}</td><td class="act">${!c.ended ? `<a class="btn sm" href="${kuendigungLink(c)}" data-stop="1">Kündigen</a>` : ''}</td></tr>`; }).join('')}</table>`
  : '<div class="empty">Noch keine Verträge. Erfasse z. B. Strom, Handy, Versicherungen, Rundfunkbeitrag …</div>'}</div>`;
};

// Dokumente
VIEWS.documents = () => {
  let list = byPerson(S.documents);
  if (UI.docCat) list = list.filter(d => d.category === UI.docCat);
  if (UI.docQ) { const q = UI.docQ.toLowerCase(); list = list.filter(d => [d.title, d.sender, d.tags, d.notes, d.fileName].join(' ').toLowerCase().includes(q)); }
  list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `<div class="head"><div class="grow"><h1>Dokumente</h1><p class="sub" style="margin:0">Briefe von Behörden, Bescheide, Verträge, Vollmachten – gescannt oder als PDF.</p></div><button class="btn pri" data-act="newDoc">${icon('plus')}Dokument hinzufügen</button></div>
  <div class="drop" id="drop">Dateien hierher ziehen oder <a href="#" data-act="newDoc">auswählen</a> · Tipp: Mit dem Handy scannen (z. B. Adobe Scan) und die PDF hier ablegen.</div>
  <div class="filters" style="margin-bottom:12px"><select data-chg="docCat"><option value="">Alle Kategorien</option>${optHTML(CATS_DOC, UI.docCat)}</select><input id="docQ" placeholder="Suchen in Titel, Absender, Schlagwörtern …" value="${esc(UI.docQ)}" style="width:300px"><span class="muted small">${list.length} Dokument(e)</span></div>
  <div class="card" style="padding:6px 8px">${list.length ? `<table class="t"><tr><th>Datum</th><th>Titel</th><th>Kategorie</th><th>Person</th><th>Absender</th><th>Vorgang</th><th>Frist</th><th></th></tr>
  ${list.map(d => `<tr><td class="small">${fmtDate(d.date)}</td><td><a href="#" data-act="openDoc" data-id="${d.id}"><b>${esc(d.title)}</b></a>${d.tags ? `<div class="small muted">${esc(d.tags)}</div>` : ''}${!d.fileId ? ' <span class="badge">ohne Datei</span>' : ''}</td><td>${esc(d.category || '')}</td><td>${personChip(d.personId)}</td><td>${esc(d.sender || '')}</td>
    <td class="small">${d.caseId && getCase(d.caseId) ? `<a href="#/case/${d.caseId}">${esc(getCase(d.caseId).title)}</a>` : ''}</td><td>${d.deadline ? dueBadge(d.deadline) : ''}</td>
    <td class="act"><button class="btn sm" data-act="dlDoc" data-id="${d.id}">⬇</button> <button class="btn sm" data-act="editDoc" data-id="${d.id}">Bearbeiten</button></td></tr>`).join('')}</table>`
  : '<div class="empty">Keine Dokumente gefunden.</div>'}</div>`;
};
AFTER.documents = () => {
  const dz = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => { const files = Array.from(e.dataTransfer.files); queueFiles(files); });
  const q = $('#docQ'); q.addEventListener('input', () => { UI.docQ = q.value; clearTimeout(q._t); q._t = setTimeout(() => { render(); const n = $('#docQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); });
};

function newLetter(q){
  const L = {id:uid(), personId: q.get('person') || (UI.person !== 'all' ? UI.person : (S.persons[0]?.id || '')), mode:'bev', contactId:'', recipient:'', templateId:'', subject:'', ref:'', customerNo: q.get('kd') || '',

  const cs = q.get('case') && getCase(q.get('case'));
  if (cs) { L.caseId = cs.id; L.ref = cs.ref || ''; if (cs.personId) L.personId = cs.personId; if (cs.contactId) L.contactId = cs.contactId; }
  if (q.get('contact')) L.contactId = q.get('contact');
  if (L.contactId) L.recipient = contactAddress(getContact(L.contactId));
  const tpl = q.get('tpl') && allTemplates().find(t => t.id === q.get('tpl'));
  if (tpl) { L.templateId = tpl.id; L.subject = tpl.subject; L.body = tpl.body; }
  return L;
}
function contactAddress(c){ if (!c) return ''; const nm = isPrivate(c) && c.salutation === 'Herr' ? 'Herrn ' + c.name : isPrivate(c) && c.salutation === 'Frau' ? 'Frau ' + c.name : c.name;
  return [nm, c.department, c.contactPerson ? 'z. Hd. ' + c.contactPerson : '', c.street, ((c.zip || '') + ' ' + (c.city || '')).trim()].filter(Boolean).join('\n'); }
// Absender: L.senderId = '' (automatisch nach „Ich schreibe …“), 'me', 'p:<Person-ID>' oder 'c:<Kontakt-ID>'
function senderOpts(){
  const me = S.settings.me;
  return [{v:'', l:'Automatisch (passend zu „Ich schreibe …“)'}, {v:'me', l:'Ich' + (me.name ? ' – ' + me.name : ' (Einstellungen)')},
    ...S.persons.map(p => ({v:'p:' + p.id, l:p.role + (personName(p) && personName(p) !== p.role ? ' – ' + personName(p) : '')})),
    ...S.contacts.filter(isPrivate).sort((a, b) => a.name.localeCompare(b.name)).map(c => ({v:'c:' + c.id, l:'Adressbuch – ' + c.name}))];
}
function senderIsMe(L){ const s = L.senderId || ''; return s === 'me' || (!s && L.mode !== 'self'); }
function senderOf(L){
  const s = L.senderId || '';
  if (s.startsWith('p:')) { const sp = getPerson(s.slice(2)); if (sp) return {name: personName(sp), street:sp.street, zip:sp.zip, city:sp.city, phone:sp.phone, email:sp.email}; }
  if (s.startsWith('c:')) { const c = getContact(s.slice(2)); if (c) return {name:c.name, street:c.street, zip:c.zip, city:c.city, phone:c.phone, email:c.email}; }
  if (s === 'me') return Object.assign({}, S.settings.me);
  const p = getPerson(L.personId);
  if (L.mode === 'self' && p) return {name: personName(p), street:p.street, zip:p.zip, city:p.city, phone:p.phone, email:p.email};
  return Object.assign({}, S.settings.me);
}
function applyVars(text, L){
  const p = getPerson(L.personId); const bev = L.mode === 'bev' && p;
  const vars = {Name: p ? personName(p) : '', NameMitAnrede: p ? anredeName(p) : '', Geburtsdatum: p && p.birth ? fmtDate(p.birth) : '', Anschrift: p ? addrOneLine(p) : '',
    Aktenzeichen: L.ref, Kundennummer: L.customerNo, Bevollmächtigter: S.settings.me.name, Datum: fmtDate(L.date),
    Krankenkasse: p ? p.healthInsurance : '', Rentenversicherungsnummer: p ? p.pensionNo : '', SteuerID: p ? p.taxId : ''};
  let t = String(text || '');
  t = t.replace(/[ \t]?\{Vertretung\}/g, bev ? ' im Namen und in Vollmacht von ' + anredeName(p) : '');
  t = t.replace(/\s*\{VollmachtAbsatz\}\s*/g, bev ? '\n\nEine Kopie der Vollmacht liegt bei.\n\n' : '\n\n');
  t = t.replace(/\{([^{}\n]+)\}/g, (m, k) => vars[k] ? vars[k] : m);
  return t.replace(/\n{3,}/g, '\n\n').trim();
}

AFTER.brief = () => {
  if (!$('#pvbox')) return;
  const upd = () => {
    const box = $('#pvbox'), sc = $('#pvscale'); if (!box) return;
    sc.innerHTML = letterHTML(LD);
    const w = box.clientWidth - 36, letter = sc.firstElementChild, s = Math.min(1, w / letter.offsetWidth);
    sc.style.transform = `scale(${s})`; sc.style.height = (letter.offsetHeight * s) + 'px'; sc.style.width = letter.offsetWidth + 'px';
    const body = letter.querySelector('.l-body'); const limit = letter.offsetWidth * 279 / 210;
    $('#pvwarn').textContent = (body.offsetTop + body.offsetHeight - 10 * letter.offsetWidth / 210) > limit ? 'Hinweis: Text geht über 1 Seite (wird beim Drucken umgebrochen).' : '';
  };
  AFTER.brief.upd = upd;
  $$('[data-lf]').forEach(el => {
    const ev = (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
    el.addEventListener(ev, () => {
      const k = el.dataset.lf; LD[k] = el.type === 'checkbox' ? el.checked : el.value;
      if (k === 'contactId') { LD.recipient = contactAddress(getContact(el.value)); const r = $('[data-lf="recipient"]'); if (r) r.value = LD.recipient; }
      if (k === 'caseId' && el.value) { const c = getCase(el.value); if (c) { if (!LD.ref && c.ref) LD.ref = c.ref; if (c.personId) LD.personId = c.personId; if (c.contactId && !LD.recipient) { LD.contactId = c.contactId; LD.recipient = contactAddress(getContact(c.contactId)); } } return render(); }
      if (k === 'mode' || k === 'useMarke' || k === 'senderId') return render();
      clearTimeout(upd._t); upd._t = setTimeout(upd, 120);
    });
  });
  const tplSel = $('[data-act-chg="tpl"]');
  tplSel.addEventListener('change', () => {
    const t = allTemplates().find(x => x.id === tplSel.value); if (!t) return;
    if (LD.body.trim() && LD.body !== (allTemplates().find(x => x.id === LD.templateId) || {}).body && !confirm('Den bisherigen Text durch die Vorlage ersetzen?')) { tplSel.value = LD.templateId; return; }
    LD.templateId = t.id; LD.subject = t.subject; LD.body = t.body; render();
  });
  window.onresize = () => { if (parseHash().route === 'brief') upd(); };
  upd();
};
const letterSubject = l => applyVars(l.subject, l) || '(ohne Betreff)';
function letterHasGaps(L){ const all = [applyVars(L.subject, L), applyVars(L.body, L), L.recipient].join('\n'); return /\{[^{}\n]+\}|\[[^\[\]\n]+\]/.test(all) || !L.recipient.trim(); }
function saveLetter(silent){
  const L = LD; delete L.isNew; L.updated = new Date().toISOString();
  const existed = S.letters.some(x => x.id === L.id);
  upsert('letters', clone(L));
  if (!existed && L.caseId) { const c = getCase(L.caseId); if (c) { c.log.push({id:uid(), date:today(), text:'Brief erstellt: ' + applyVars(L.subject, L) + (L.shipping ? ' (' + L.shipping + ')' : '')}); save(); } }
  if (!silent) toast('Brief gespeichert');
  if (!existed) { LDkey = '#/brief/' + L.id; history.replaceState(null, '', '#/brief/' + L.id); render._same = location.hash; render(); }
}
// Ausgabe: im Desktop-Programm über window.officeHome (Drucken bzw. PDF speichern), im Browser über window.print()
const DESKTOP = !!(window.officeHome && window.officeHome.desktop);
function outputPrint(html, title, asPDF){
  $('#print-root').innerHTML = html;
  const t = document.title; document.title = title.replace(/[\\/:*?"<>|]/g, '').slice(0, 90);
  setTimeout(async () => {
    try {
      if (DESKTOP) { const r = asPDF ? await window.officeHome.savePDF(document.title) : await window.officeHome.print(); if (asPDF && r && r.ok) toast('PDF gespeichert'); }
      else window.print();
    } catch (e) { alert('Ausgabe fehlgeschlagen: ' + e.message); }
    finally { document.title = t; }
  }, 150);
}
function printLetter(asPDF){
  if (letterHasGaps(LD) && !confirm('Es gibt noch gelb markierte Stellen bzw. keinen Empfänger. Trotzdem ' + (asPDF ? 'als PDF speichern' : 'drucken') + '?')) return;
  saveLetter(true);
  outputPrint(letterHTML(LD), 'Brief ' + LD.date + ' ' + applyVars(LD.subject, LD), asPDF);
}

// ---------- Monatsbericht ----------
function monthShift(ym, n){ return addMonths(ym + '-01', n).slice(0, 7); }
function monthLabel(ym){ const [y, m] = ym.split('-').map(Number); return MONATE[m - 1] + ' ' + y; }
function reportHTML(ym){
  const inM = d => !!d && String(d).slice(0, 7) === ym;
  const first = ym + '-01', last = isoDate(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0));
  const nextLast = isoDate(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) + 1, 0));
  const pName = id => { const p = getPerson(id); return p ? p.role : 'Allgemein'; };
  const who = UI.person === 'all' ? 'alle Personen' : (() => { const p = getPerson(UI.person); return p ? p.role + (personName(p) !== p.role ? ': ' + personName(p) : '') : ''; })();
  const tbl = (head, rows, empty) => rows.length ? `<table><tr>${head.map(h => `<th${h.startsWith('#') ? ' class="num"' : ''}>${esc(h.replace(/^#/, ''))}</th>`).join('')}</tr>${rows.join('')}</table>` : `<p class="none">${esc(empty)}</p>`;
  const td = (v, num) => `<td${num ? ' class="num"' : ''}>${v}</td>`;

  // Erledigte Aufgaben (auch wiederkehrende, die im Monat abgehakt wurden)
  const done = byPerson(S.tasks).filter(t => (t.done && inM(t.doneAt)) || (t.repeat && inM(t.lastDone)))
    .sort((a, b) => (a.doneAt || a.lastDone || '').localeCompare(b.doneAt || b.lastDone || ''));
  // Verlauf aus Vorgängen
  const logs = [];
  for (const c of byPerson(S.cases)) for (const l of (c.log || [])) if (inM(l.date)) logs.push({date:l.date, c, text:l.text});
  logs.sort((a, b) => a.date.localeCompare(b.date));
  const letters = byPerson(S.letters).filter(l => inM(l.date)).sort((a, b) => a.date.localeCompare(b.date));
  const docs = byPerson(S.documents).filter(d => inM(d.date) || (!d.date && inM(d.added))).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  // Offene Fristen: überfällig oder fällig bis Ende des Folgemonats
  const open = byPerson(S.tasks).filter(t => !t.done && t.due && t.due <= nextLast).sort((a, b) => a.due.localeCompare(b.due));
  const cancel = byPerson(S.contracts).map(c => ({c, i:contractInfo(c)})).filter(x => x.i.cancelBy && x.i.cancelBy >= first && x.i.cancelBy <= nextLast).sort((a, b) => a.i.cancelBy.localeCompare(b.i.cancelBy));
  const openCases = byPerson(S.cases).filter(c => c.status !== 'erledigt');
  const contracts = byPerson(S.contracts).filter(c => !c.ended);
  const mon = contracts.reduce((s, c) => s + monthly(c), 0);
  const assets = byPerson(S.assets); const saldo = assets.reduce((s, a) => s + (Number(a.value) || 0), 0);
  const me = S.settings.me;

  return `<div class="report">
    <h1>Monatsbericht ${esc(monthLabel(ym))}</h1>
    <div class="rsub">${esc(who)} · Zeitraum ${fmtDate(first)} – ${fmtDate(last)} · erstellt am ${fmtDate(today())}${me.name ? ' von ' + esc(me.name) : ''}</div>
    <div class="sums">
      <div>Erledigt<b>${done.length}</b></div><div>Briefe / Dokumente<b>${letters.length} / ${docs.length}</b></div>
      <div>Offene Vorgänge<b>${openCases.length}</b></div><div>Fixkosten / Monat<b>${eur(mon)}</b></div>
    </div>

    <h2>1. Erledigte Aufgaben und Fristen</h2>
    ${tbl(['Datum', 'Aufgabe', 'Person', 'Vorgang'], done.map(t => `<tr>${td(fmtDate(t.done ? t.doneAt : t.lastDone))}${td(esc(t.title) + (t.repeat && !t.done ? ' (wiederkehrend)' : ''))}${td(esc(pName(t.personId)))}${td(esc(getCase(t.caseId)?.title || ''))}</tr>`), 'In diesem Monat wurden keine Aufgaben erledigt.')}

    <h2>2. Verlauf der Vorgänge</h2>
    ${tbl(['Datum', 'Vorgang', 'Person', 'Eintrag'], logs.map(l => `<tr>${td(fmtDate(l.date))}${td(esc(l.c.title))}${td(esc(pName(l.c.personId)))}${td(esc(l.text).replace(/\n/g, '<br>'))}</tr>`), 'Keine Einträge im Verlauf.')}

    <h2>3. Geschriebene Briefe</h2>
    ${tbl(['Datum', 'Betreff', 'Empfänger', 'Versand'], letters.map(l => `<tr>${td(fmtDate(l.date))}${td(esc(letterSubject(l)))}${td(esc((l.recipient || '').split('\n')[0]))}${td(esc(l.shipping || ''))}</tr>`), 'Keine Briefe in diesem Monat.')}

    <h2>4. Eingegangene Dokumente</h2>
    ${tbl(['Datum', 'Titel', 'Absender', 'Person', 'Frist'], docs.map(d => `<tr>${td(fmtDate(d.date || d.added))}${td(esc(d.title))}${td(esc(d.sender || ''))}${td(esc(pName(d.personId)))}${td(d.deadline ? fmtDate(d.deadline) : '')}</tr>`), 'Keine Dokumente in diesem Monat.')}

    <h2>5. Offene Fristen bis ${fmtDate(nextLast)}</h2>
    ${tbl(['Fällig', 'Aufgabe', 'Person', 'Vorgang'], open.map(t => `<tr>${td(`<span class="${t.due < today() ? 'over' : ''}">${fmtDate(t.due)}${t.due < today() ? ' (überfällig)' : ''}</span>`)}${td(esc(t.title))}${td(esc(pName(t.personId)))}${td(esc(getCase(t.caseId)?.title || ''))}</tr>`)
      .concat(cancel.map(x => `<tr>${td(fmtDate(x.i.cancelBy))}${td('Kündigungsfrist: ' + esc(x.c.provider))}${td(esc(pName(x.c.personId)))}${td('Vertrag')}</tr>`)), 'Keine offenen Fristen.')}

    <h2>6. Offene Vorgänge</h2>
    ${tbl(['Vorgang', 'Person', 'Behörde / Stelle', 'Aktenzeichen', 'Status'], openCases.map(c => `<tr>${td(esc(c.title))}${td(esc(pName(c.personId)))}${td(esc(getContact(c.contactId)?.name || ''))}${td(esc(c.ref || ''))}${td(esc(c.status || 'offen'))}</tr>`), 'Keine offenen Vorgänge.')}

    <h2>7. Fixkosten (laufende Verträge)</h2>
    ${tbl(['Anbieter', 'Kategorie', 'Person', '#Betrag', '#pro Monat'], contracts.map(c => `<tr>${td(esc(c.provider))}${td(esc(c.category || ''))}${td(esc(pName(c.personId)))}${td(eur(c.amount) + ' ' + esc(c.interval || ''), 1)}${td(eur(monthly(c)), 1)}</tr>`)
      .concat(contracts.length ? [`<tr><td colspan="4"><b>Summe pro Monat</b></td><td class="num"><b>${eur(mon)}</b></td></tr>`] : []), 'Keine laufenden Verträge erfasst.')}

    <h2>8. Konten und Vermögen</h2>
    ${tbl(['Bezeichnung', 'Art', 'Person', 'Stand vom', '#Wert'], assets.map(a => `<tr>${td(esc(a.name))}${td(esc(a.type || ''))}${td(esc(pName(a.personId)))}${td(fmtDate(a.valueDate))}${td(a.value === '' || a.value == null ? '' : eur(a.value), 1)}</tr>`)
      .concat(assets.length ? [`<tr><td colspan="4"><b>Saldo</b></td><td class="num"><b>${eur(saldo)}</b></td></tr>`] : []), 'Keine Konten erfasst.')}

    <div class="rsig"><div>Ort, Datum</div><div>Unterschrift ${me.name ? '(' + esc(me.name) + ')' : ''}</div></div>
  </div>`;
}
VIEWS.report = () => `<div class="head"><div class="grow"><h1>Monatsbericht</h1><p class="sub" style="margin:0">Übersicht eines Monats zum Drucken oder als PDF – z. B. für die eigenen Unterlagen oder zur Abstimmung in der Familie. Die Auswahl oben (Alle / Vater / Mutter) gilt auch hier.</p></div>

      <p class="small muted" style="margin-top:0">Unterschrift auf weißem Papier mit dunklem Stift, abfotografieren oder scannen, zuschneiden und hier laden (PNG mit transparentem Hintergrund ist ideal).</p>
      <div style="display:flex;gap:28px;flex-wrap:wrap"><div><b class="small">Unterschrift</b>${s.signature ? `<img class="imgprev" src="${s.signature}">` : '<div class="imgprev muted small" style="width:200px;height:60px;display:grid;place-items:center">keine</div>'}
        <button class="btn sm" data-act="upImg" data-id="signature">Laden</button> ${s.signature ? '<button class="btn sm dan" data-act="delImg" data-id="signature">Entfernen</button>' : ''}</div>
      <div><b class="small">Stempel / Siegel</b>${s.stamp ? `<img class="imgprev" src="${s.stamp}">` : '<div class="imgprev muted small" style="width:200px;height:60px;display:grid;place-items:center">keiner</div>'}
        <button class="btn sm" data-act="upImg" data-id="stamp">Laden</button> ${s.stamp ? '<button class="btn sm dan" data-act="delImg" data-id="stamp">Entfernen</button>' : ''}</div></div></div>
    <div class="card"><h3>Erinnerungen</h3><div class="modal" style="box-shadow:none;width:100%;max-height:none"><form style="padding:0" onsubmit="return false">
      <div class="fld"><label>Vertragskündigungen anzeigen (Tage vorher)</label><input type="number" data-set="contractDays" value="${s.contractDays}"></div><div></div>
    </form></div><p class="small muted">Fristen kannst du unter „Fristen & Aufgaben“ als .ics-Datei in deinen Kalender (Outlook, Google, Apple) übernehmen – mit Erinnerung 2 Tage vorher.</p></div>
    ${DESKTOP ? `<div class="card" id="updCard" style="grid-column:1/-1">${updCardHTML()}</div>` : ''}
    <div class="card" style="grid-column:1/-1"><h3>${icon('save')}Datensicherung</h3>
      <p style="margin-top:0">Alle Daten liegen <b>nur auf diesem Computer</b> (im Browser-Speicher dieses Programms). Erstelle regelmäßig eine Sicherung und speichere sie z. B. auf einem USB-Stick.</p>
      <p class="small muted">Letzte Sicherung: ${s.lastBackup ? fmtDate(s.lastBackup) : 'noch nie'} · <span id="usage"></span></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="backup">Sicherung herunterladen</button><button class="btn" data-act="restore">Sicherung wiederherstellen</button><span style="flex:1"></span><button class="btn dan" data-act="wipe">Alle Daten löschen</button></div></div>
  </div>`;
};
AFTER.settings = async () => {
  $$('[data-set]').forEach(el => el.addEventListener('change', () => {
    const path = el.dataset.set.split('.'); let o = S.settings; for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    let v = el.value; if (v === 'true') v = true; else if (v === 'false') v = false; else if (el.type === 'number' || path[1] === 'size') v = Number(v);
    o[path[path.length - 1]] = v; save(); toast('Gespeichert'); if (el.dataset.rerender || path[0] === 'letter') render();
  }));
  if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); const u = $('#usage'); if (u) u.textContent = 'Belegter Speicher: ' + (e.usage / 1048576).toFixed(1) + ' MB'; }
};

// ---------- Sicherung / Kalender ----------
async function backup(){
  const files = {};
  for (const d of S.documents) if (d.fileId) { const f = await fileGet(d.fileId); if (f) files[d.fileId] = {name:f.name, type:f.type, data: await blobToDataURL(f.blob)}; }
  S.settings.lastBackup = today(); save();
  const data = {app:'OfficeHome', version:1, exported:new Date().toISOString(), state:S, files};
  download(`OfficeHome-Sicherung-${today()}.json`, new Blob([JSON.stringify(data)], {type:'application/json'}));
  toast('Sicherung erstellt'); render();
}
async function restore(){
  const f = await pickFile('.json,application/json'); if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch (e) { return alert('Datei ist keine gültige Sicherung.'); }
  if (data.app !== 'OfficeHome' || !data.state) return alert('Datei ist keine Office-Home-Sicherung.');
  if (!confirm('Achtung: Alle aktuellen Daten werden durch die Sicherung vom ' + fmtDate((data.exported || '').slice(0, 10)) + ' ersetzt. Fortfahren?')) return;
  if (DB.db) await DB.clear('files');
  for (const [id, x] of Object.entries(data.files || {})) await filePut(id, {name:x.name, type:x.type, blob: await dataURLtoBlob(x.data)});
  S = migrate(data.state); save(); toast('Sicherung wiederhergestellt'); location.hash = '#/dashboard'; render();
}
async function wipe(){
  if (!confirm('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.')) return;
  if (prompt('Zur Bestätigung bitte LÖSCHEN eingeben:') !== 'LÖSCHEN') return;
  if (DB.db) await DB.clear('files'); S = defaultState(); save(); location.hash = '#/dashboard'; render();
}
function exportICS(){
  const ev = [];
  const fold = s => s.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const add = (date, title, desc) => { const d = date.replace(/-/g, ''); const nx = addMonths(date, 0); const end = isoDate(new Date(new Date(nx + 'T00:00').getTime() + 86400000)).replace(/-/g, '');
    ev.push(['BEGIN:VEVENT', 'UID:' + uid() + '@officehome', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + end, 'SUMMARY:' + fold(title), 'DESCRIPTION:' + fold(desc || ''),
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + fold(title), 'TRIGGER:-P2D', 'END:VALARM', 'END:VEVENT'].join('\r\n')); };
  for (const t of byPerson(S.tasks)) if (!t.done && t.due) add(t.due, t.title + (getPerson(t.personId) ? ' (' + getPerson(t.personId).role + ')' : ''), t.notes);
  for (const c of byPerson(S.contracts)) { const i = contractInfo(c); if (i.cancelBy) add(i.cancelBy, 'Kündigen bis: ' + c.provider, 'Vertragsende ' + fmtDate(i.end)); }
  if (!ev.length) return toast('Keine Fristen mit Datum vorhanden');
  download('OfficeHome-Fristen.ics', new Blob(['BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Office Home//DE\r\nCALSCALE:GREGORIAN\r\n' + ev.join('\r\n') + '\r\nEND:VCALENDAR\r\n'], {type:'text/calendar'}));
  toast(ev.length + ' Termine exportiert');
}

// ---------- Aktionen ----------
const ACT = {
  pfilter: d => { UI.person = d.id; render(); },
  newTask: d => editTask(null, d.case ? {caseId:d.case, personId:getCase(d.case)?.personId || ''} : {}),
  editTask: d => editTask(S.tasks.find(t => t.id === d.id)),
  toggleTask: d => toggleTask(S.tasks.find(t => t.id === d.id)),
  newCase: () => editCase(null), editCase: d => editCase(getCase(d.id)),
  caseTab: d => { UI.caseTab = d.id; render(); }, taskTab: d => { UI.taskTab = d.id; render(); },
  toggleStep: d => { const c = getCase(d.id); const s = c.steps.find(x => x.id === d.sid); s.done = !s.done; if (s.done) c.log.push({id:uid(), date:today(), text:'Schritt erledigt: ' + s.text}); save(); render(); },
  delStep: d => { const c = getCase(d.id); c.steps = c.steps.filter(x => x.id !== d.sid); save(); render(); },
  addStep: d => { const v = $('#newStep').value.trim(); if (!v) return; getCase(d.id).steps.push({id:uid(), text:v, done:false}); save(); render(); setTimeout(() => $('#newStep')?.focus(), 0); },
  addLog: d => { const v = $('#logText').value.trim(); if (!v) return; getCase(d.id).log.push({id:uid(), date:$('#logDate').value || today(), text:v}); save(); render(); },
  delLog: d => { const c = getCase(d.id); c.log = c.log.filter(x => x.id !== d.sid); save(); render(); },
  newContract: () => editContract(null), editContract: d => editContract(S.contracts.find(c => c.id === d.id)),
  newDoc: d => editDoc(null, Object.assign({}, d.case ? {caseId:d.case, personId:getCase(d.case)?.personId || ''} : {}, d.person ? {personId:d.person} : {}, d.cat ? {category:d.cat, title:'Vollmacht ' + (getPerson(d.person)?.role || '')} : {})),
  editDoc: d => editDoc(S.documents.find(x => x.id === d.id)),
  openDoc: d => openDoc(S.documents.find(x => x.id === d.id)),
  dlDoc: async d => { const doc = S.documents.find(x => x.id === d.id); const f = doc.fileId && await fileGet(doc.fileId); if (f) download(f.name, f.blob); else toast('Keine Datei hinterlegt'); },
  newAsset: () => editAsset(null), editAsset: d => editAsset(S.assets.find(a => a.id === d.id)),
  newNote: () => editNote(null), editNote: d => editNote(S.notes.find(n => n.id === d.id)),
  newPerson: () => editPerson(null), editPerson: d => editPerson(getPerson(d.id)),
  newContact: () => editContact(null), editContact: d => editContact(getContact(d.id)),
  briefNewContact: () => editContact(null, c => { LD.contactId = c.id; LD.recipient = contactAddress(c); render(); }),
  briefNewSender: () => editContact(null, c => { LD.senderId = isPrivate(c) ? 'c:' + c.id : LD.senderId; render(); }, {kind:'Privatperson'}),
  ckind: d => { UI.contactKind = d.id; render(); },
  insPh: d => { const ta = $('#briefBody'); const ins = '{' + d.id + '}'; const s = ta.selectionStart, e = ta.selectionEnd; ta.value = ta.value.slice(0, s) + ins + ta.value.slice(e); ta.selectionStart = ta.selectionEnd = s + ins.length; ta.focus(); ta.dispatchEvent(new Event('input')); },
  saveLetter: () => saveLetter(false), printLetter: () => printLetter(false), pdfLetter: () => printLetter(true),
  saveTpl: () => { const n = prompt('Name der Vorlage:', LD.subject ? LD.subject.slice(0, 50) : ''); if (!n) return; const t = {id:'c_' + uid(), name:n, subject:LD.subject, body:LD.body, custom:true}; S.templates.push(t); LD.templateId = t.id; save(); toast('Vorlage gespeichert'); render(); },
  delTpl: d => { if (confirm('Vorlage löschen?')) { remove('templates', d.id); render(); } },
  dupLetter: d => { const l = clone(S.letters.find(x => x.id === d.id)); l.id = uid(); l.date = today(); l.updated = new Date().toISOString(); S.letters.push(l); save(); location.hash = '#/brief/' + l.id; },
  delLetter: d => { if (confirm('Brief löschen?')) { remove('letters', d.id); render(); } },
  markeUpload: async () => { const f = await pickFile('image/*'); if (!f) return; LD.markeImg = await imageToDataURL(f, 700); render(); },
  markeDel: () => { LD.markeImg = ''; render(); },
  upImg: async d => { const f = await pickFile('image/*'); if (!f) return; S.settings[d.id] = await imageToDataURL(f, 900); save(); render(); },
  delImg: d => { S.settings[d.id] = ''; save(); render(); },
  setDesign: d => { S.settings.letter.design = d.id; save(); render(); toast('Briefvorlage: ' + (LETTER_DESIGNS.find(x => x.v === d.id) || {}).l); },
  repMonth: d => { UI.reportMonth = monthShift(UI.reportMonth, Number(d.id)); render(); },
  printReport: () => printReport(false), pdfReport: () => printReport(true),
  backup: () => backup(), restore:() => restore(), wipe: () => wipe(), ics: () => exportICS()
};
document.addEventListener('click', e => {
  if ($('#modal') && $('#modal').contains(e.target)) return;
  const stop = e.target.closest('[data-stop]');
  const a = e.target.closest('[data-act]');
  if (a && (!stop || stop === a || a.contains(stop) === false && stop.contains(a))) {
    if (a.tagName === 'INPUT' && a.type === 'checkbox') { e.preventDefault(); }
    else if (a.tagName === 'A' || a.tagName === 'BUTTON') e.preventDefault();
    if (ACT[a.dataset.act]) ACT[a.dataset.act](Object.assign({}, a.dataset), a, e);
    return;
  }
  if (stop) return;
  const g = e.target.closest('[data-go]'); if (g) location.hash = g.dataset.go;
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  if (el.dataset.chg === 'caseStatus') { const c = getCase(el.dataset.id); c.status = el.value; c.log.push({id:uid(), date:today(), text:'Status: ' + el.value}); save(); render(); }
  if (el.dataset.chg === 'docCat') { UI.docCat = el.value; render(); }
  if (el.dataset.chg === 'reportMonth' && /^\d{4}-\d{2}$/.test(el.value)) { UI.reportMonth = el.value; render(); }
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { location.hash = '#/search?q=' + encodeURIComponent(e.target.value); } });
window.addEventListener('hashchange', render);
window.addEventListener('beforeunload', () => { if (saveTimer && DB.db) { clearTimeout(saveTimer); DB.put('kv', 'state', S); } });

// ---------- Programm-Update (nur Desktop) ----------
const UPD = {state:'idle', current:'', version:'', percent:0, message:''};
function updCardHTML(){
  const u = UPD; let st = '', btn = '';
  if (u.state === 'checking') st = 'Suche nach Updates …';
  else if (u.state === 'none') st = '✓ Du hast die neueste Version.';
  else if (u.state === 'available') { st = `<b>Neue Version ${esc(u.version)} verfügbar.</b>`; btn = '<button class="btn pri" data-act="updDownload">Herunterladen und installieren</button>'; }
  else if (u.state === 'downloading') st = `Wird heruntergeladen … ${u.percent} %<div style="height:6px;background:#e5e7eb;border-radius:3px;margin-top:6px"><div style="height:6px;width:${u.percent}%;background:#2563eb;border-radius:3px"></div></div>`;
  else if (u.state === 'downloaded') { st = `<b>Version ${esc(u.version)} ist bereit.</b> Das Programm schließt sich kurz, installiert das Update und startet neu. Deine Daten bleiben erhalten.`; btn = '<button class="btn pri" data-act="updInstall">Jetzt installieren und neu starten</button>'; }
  else if (u.state === 'error') st = `<span style="color:#b91c1c">Update fehlgeschlagen: ${esc(u.message)}</span>`;
  return `<h3>Programm-Update</h3><p style="margin-top:0">Installierte Version: <b>${esc(u.current || '–')}</b></p>
    ${st ? `<p>${st}</p>` : ''}<div style="display:flex;gap:8px;flex-wrap:wrap">${btn}${['idle', 'none', 'error'].includes(u.state) ? '<button class="btn" data-act="updCheck">Nach Updates suchen</button>' : ''}</div>
    <p class="small muted">Das Programm sucht beim Start automatisch nach einer neuen Version (Internet nötig).</p>`;
}
function updUI(){
  const card = $('#updCard'); if (card) card.innerHTML = updCardHTML();
  const chip = $('#updChip'); if (!chip) return;
  const show = ['available', 'downloading', 'downloaded'].includes(UPD.state);
  chip.innerHTML = show ? `<a href="#/settings" class="updchip">${UPD.state === 'downloaded' ? 'Update bereit – neu starten' : UPD.state === 'downloading' ? 'Update lädt … ' + UPD.percent + ' %' : 'Update ' + esc(UPD.version) + ' verfügbar'}</a>` : '';
}
function initUpdates(){
  if (!DESKTOP || !window.officeHome.onUpdate) return;
  window.officeHome.version().then(v => { UPD.current = v; updUI(); });
  window.officeHome.onUpdate(d => {
    if (d.type === 'available') { UPD.state = 'available'; UPD.version = d.version; toast('Neue Version ' + d.version + ' verfügbar'); }
    else if (d.type === 'none') { if (UPD.state === 'checking') UPD.state = 'none'; }
    else if (d.type === 'progress') { UPD.state = 'downloading'; UPD.percent = d.percent; }
    else if (d.type === 'downloaded') { UPD.state = 'downloaded'; UPD.version = d.version; }
    else if (d.type === 'error') { if (UPD.state !== 'idle') { UPD.state = 'error'; UPD.message = d.message; } }
    updUI();
  });
}
async function flushSave(){ clearTimeout(saveTimer); if (DB.db) await DB.put('kv', 'state', S); }
Object.assign(ACT, {
  updCheck: async () => { UPD.state = 'checking'; updUI(); const r = await window.officeHome.updateCheck();
    if (!r.ok) { UPD.state = 'error'; UPD.message = r.message; } else if (UPD.state === 'checking') UPD.state = r.latest && r.latest !== r.current ? UPD.state : 'none'; updUI(); },
  updDownload: async () => { UPD.state = 'downloading'; UPD.percent = 0; updUI(); const r = await window.officeHome.updateDownload(); if (!r.ok) { UPD.state = 'error'; UPD.message = r.message; updUI(); } },
  updInstall: async () => { await flushSave(); toast('Update wird installiert …'); await window.officeHome.updateInstall(); }
});

// ---------- Start ----------
(async () => {
  try { await DB.open(); const st = await DB.get('kv', 'state'); if (st) S = migrate(st); }
  catch (e) { DB.db = null; document.body.insertAdjacentHTML('afterbegin', '<div class="banner red" style="margin:0;border-radius:0">Lokaler Speicher nicht verfügbar – bitte mit Google Chrome oder Microsoft Edge öffnen. Änderungen werden sonst nicht gespeichert.</div>'); }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  render(); initUpdates();
})();
</script>
</body>
